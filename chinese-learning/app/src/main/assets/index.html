<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b53"><title>Future Code Chinese · တရုတ်စာသင်</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#112744;background:#f4f7fc;font-family:system-ui,"Noto Sans Myanmar","Noto Sans SC",sans-serif;line-height:1.7}button{font-family:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #f0b83d;outline-offset:3px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(110deg,#112b52,#1556a4);color:white;box-shadow:0 5px 16px #09264522;display:flex;gap:13px;align-items:center;padding:17px max(18px,env(safe-area-inset-right))}
.logo{width:45px;height:45px;background:#fff2;border:1px solid #ffffff44;border-radius:14px;display:grid;place-items:center;font-size:25px;color:#ffdb91;font-weight:900}
.top strong{display:block;font-size:16px;line-height:1.35}.top small{color:#d3e6ff;font-size:11px}.top .right{margin-left:auto;font-size:11px;border:1px solid #ffffff66;border-radius:99px;padding:4px 9px}
main{max-width:810px;margin:0 auto;padding:20px 17px 112px}.hero{background:radial-gradient(circle at 95% 8%,#438fe9 0,transparent 45%),linear-gradient(120deg,#102b53,#124c91);border-radius:24px;color:white;padding:25px 21px;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:900;color:#f6d28c}.hero h1{font-size:26px;line-height:1.46;margin:8px 0}.hero p{color:#d8e8ff;font-size:13px;line-height:1.85;margin:0 0 18px}
.hero .btn{background:#f9cd7e;color:#112744}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:17px 0}.stat{background:white;border-radius:15px;padding:13px 9px;box-shadow:0 3px 15px #1746720c;text-align:center}.stat b{font-size:20px;display:block;color:#1453a1}.stat span{font-size:11px;color:#5e6b7c}
h2{font-size:19px;line-height:1.55;margin:24px 0 13px}.muted{color:#65758b;font-size:13px}.levelgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{display:block;text-align:left;border:1px solid #e1e8f1;border-radius:19px;background:white;padding:17px;box-shadow:0 5px 12px #1437610a;color:inherit}.tile:active{transform:scale(.99)}.tile .num{display:inline-grid;place-items:center;color:#1452a7;background:#e9f2ff;border-radius:12px;width:36px;height:36px;font-weight:900}.tile h3{margin:11px 0 4px;font-size:15px;line-height:1.5}.tile p{margin:0;color:#65758b;font-size:11px;min-height:38px}.bar{background:#e4ecf5;height:7px;border-radius:100px;overflow:hidden;margin:11px 0 4px}.bar>i{height:100%;display:block;background:#2f9d85;border-radius:100px}.tile small{font-size:11px;color:#506683}
.btn{border-radius:13px;background:#1766c4;color:white;font-size:13px;padding:11px 16px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}.btn.secondary{background:#e9f2ff;color:#184d91}.btn.gold{background:#f7d18e;color:#112744}.btn.green{background:#13836e}.btn:disabled{opacity:.5}.actions{display:flex;flex-wrap:wrap;gap:9px}.sectionbox{background:#fff;border:1px solid #e4eaf1;border-radius:18px;padding:17px;margin:12px 0}.sectionbox h3{font-size:16px;margin:2px 0}.sectionbox .explain{font-size:13px;color:#405a7a;white-space:pre-wrap}.crumb{font-size:12px;color:#5c7695;margin:4px 0 9px}.word{border-bottom:1px solid #eaf0f5;padding:16px 0}.word:last-child{border-bottom:0}.hanzi{font-size:25px;line-height:1.5;color:#0d3766;font-weight:800;overflow-wrap:anywhere}.pinyin{font-size:14px;color:#2378b8;letter-spacing:.02em}.translation{font-size:13px;color:#495c73;margin:2px 0 10px}.wordtools{display:flex;gap:8px;flex-wrap:wrap}.wordtools button{border:1px solid #cfdef1;background:#f5f9fd;color:#20568d;padding:7px 11px;border-radius:11px;font-size:12px;font-weight:700}
.pill{display:inline-flex;border-radius:99px;background:#eaf5ed;color:#137657;padding:5px 10px;font-size:11px;font-weight:800}.notification{margin:15px 0;background:#fff6e0;border:1px solid #f4d18b;border-radius:13px;padding:13px;color:#654b15;font-size:13px}.flash{background:linear-gradient(145deg,#fff,#eef5ff);box-shadow:0 9px 25px #13477816;border:1px solid #cddced;border-radius:24px;min-height:280px;padding:30px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flash .hanzi{font-size:40px}.flash p{font-size:14px;color:#526781}.quiz-option{width:100%;display:block;text-align:left;background:white;border:1px solid #cddbea;color:#193d67;padding:12px 15px;margin:9px 0;border-radius:12px;font-size:14px}.quiz-option.correct{border-color:#108667;background:#edf9f4}.quiz-option.wrong{border-color:#bc4343;background:#fff0f0}.canvaswrap{background:#fff;border-radius:20px;overflow:hidden;border:2px solid #cedcf0;position:relative}.canvaswrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent calc(50% - 1px),#dae3ef 50%,transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),#dae3ef 50%,transparent calc(50% + 1px));opacity:.6}
#ink{display:block;width:100%;height:300px;touch-action:none}.write-model{font-size:55px;color:#1d528d;text-align:center;font-weight:800}.smallhelp{font-size:12px;color:#62758c;margin:9px 0}footer{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);background:#fff;box-shadow:0 -4px 18px #142d501a;display:flex;z-index:10;justify-content:center}footer button{flex:1;max-width:150px;background:transparent;color:#688199;padding:11px 3px 12px;font-size:11px;font-weight:700;display:grid;gap:1px;text-align:center}footer button .ico{font-size:21px}footer button.active{color:#125cae;background:#eef6ff}#toast{position:fixed;z-index:20;bottom:94px;left:50%;transform:translateX(-50%);max-width:90vw;border-radius:14px;background:#112b52;color:white;padding:12px 16px;font-size:13px;display:none;box-shadow:0 8px 25px #142c544d}
@media(min-width:720px){.levelgrid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:33px}main{padding-bottom:130px}}@media(max-width:370px){.levelgrid{grid-template-columns:1fr}.top .right{display:none}}
</style>
</head>
<body>
<header class="top"><div class="logo" aria-hidden="true">F<span style="font-size:14px">语</span></div><div><strong>FUTURE CODE CHINESE</strong><small>မြန်မာလို သင်ယူမယ့် တရုတ်စကားပြောသင်တန်း</small></div><span class="right">汉语 · 中文</span></header>
<main id="app"><p style="padding:16px;font-size:13px;line-height:1.9">APK ထဲတွင် Neural အသံဖိုင်များ ပါဝင်သည်။ နားထောင်၊ ရပ်၊ လိုက်ပြော၊ မူရင်းနှင့်နှိုင်းယှဉ်ပါ။ အသံမှစာသား ကိုက်ညီမှုသည် အသံနေအသံထား ကျွမ်းကျင်မှုအမှတ် မဟုတ်ပါ။ သင်ခန်းစာများကို ဆရာနှင့် စကားပြောလေ့ကျင့်မှုဖြင့် ဖြည့်စွက်ပါ။</p></main>
<footer aria-label="အဓိကမီနူး">
<button data-go="home" class="active"><span class="ico">⌂</span>ပင်မ</button>
<button data-go="levels"><span class="ico">▦</span>သင်ခန်းစာ</button>
<button data-go="flash"><span class="ico">▤</span>ကတ်</button>
<button data-go="write"><span class="ico">✎</span>လက်ရေး</button>
<button data-go="settings"><span class="ico">⚙</span>ဆက်တင်</button>
</footer><div id="toast" role="status"></div>
<script src="course.js"></script><script src="app.js"></script>
</body></html>
