function catalog(){const params=route().params;let search=params.get('search')||'',cat=params.get('category')||'All',veh=params.get('vehicle')||'';catFilter=cat;vehicleFilter=veh;const term=search.toLowerCase().trim();let items=products.filter(p=> (cat==='All'||p.category===cat) && (!term||[p.name,p.mm,p.sku,p.partNo,p.brand,p.category].join(' ').toLowerCase().includes(term)) && (!veh||p.fit.some(x=>x.toLowerCase().includes(veh.toLowerCase()))) && (!stockOnly||p.stock>0));if(sortBy==='price-low')items.sort((a,b)=>a.price-b.price);if(sortBy==='price-high')items.sort((a,b)=>b.price-a.price);if(sortBy==='name')items.sort((a,b)=>a.name.localeCompare(b.name));let subtitle=veh?`Vehicle filter: ${esc(veh)} — fitment is indicative only`:search?`Results for “${esc(search)}”`:'Find the right component for your vehicle.';return `<main>${pageHead('SHOP ALL PARTS',subtitle)}<div class="container">${bread([{label:'Shop All Parts'}])}<div class="catalog-layout"><aside class="sidebar"><h4>FILTER PRODUCTS</h4><div class="side-group"><div class="side-title">CATEGORIES</div><label><span>All Products</span><input type="radio" name="catalog-category" value="All" ${cat==='All'?'checked':''}></label>${CATEGORIES.map(c=>`<label><span>${esc(c[1])}</span><input type="radio" name="catalog-category" value="${c[0]}" ${cat===c[0]?'checked':''}></label>`).join('')}</div><div class="side-group"><div class="side-title">AVAILABILITY</div><label><span>In stock only</span><input type="checkbox" id="stock-only" ${stockOnly?'checked':''}></label></div><div class="fitment-tip">${icon('info',17)} Part number ကိုက်ညီရုံနဲ့ ကားမှာတပ်ဆင်လို့ရကြောင်း အာမခံမရပါ။ Engine / Chassis စစ်ဆေးပါ။</div></aside><div><div class="catalog-top"><span>SHOWING <b>${items.length}</b> PRODUCTS ${cat!=='All'?`• ${esc(cat)}`:''}</span><div class="view-buttons"><div class="mini-filter"><select id="mobile-category">${[['All','All Categories'],...CATEGORIES.map(c=>[c[0],c[1]])].map(c=>`<option value="${c[0]}" ${cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div><select id="sort-products"><option value="featured" ${sortBy==='featured'?'selected':''}>Featured</option><option value="price-low" ${sortBy==='price-low'?'selected':''}>Price: Low to High</option><option value="price-high" ${sortBy==='price-high'?'selected':''}>Price: High to Low</option><option value="name" ${sortBy==='name'?'selected':''}>Name A–Z</option></select></div></div><div class="products-grid">${items.length?items.map(productCard).join(''):`<div class="empty">${icon('search')}<h3>NO MATCHING PARTS</h3><p>ပစ္စည်းမတွေ့ပါ။ Search လျှော့ရှာပါ၊ သို့မဟုတ် Brand/Model ပြန်ရွေးပါ။</p><a class="btn btn-primary" href="#/shop">CLEAR FILTERS</a></div>`}</div></div></div></div></main>`}

function detail(){const slug=route().path.split('/')[1];const p=getProduct(slug);if(!p)return `<main class="container section"><div class="empty"><h3>PRODUCT NOT FOUND</h3><a class="btn btn-primary" href="#/shop">BACK TO SHOP</a></div></main>`;const avail=p.stock>0;const suggestions=products.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4);return `<main class="container">${bread([{label:'Shop All Parts',path:'shop'},{label:p.name}])}<div class="product-detail"><div class="detail-image"><img src="${imgPath(p)}" alt="Illustration of ${esc(p.name)}"></div><div class="detail-info"><div class="product-brand">${esc(p.brand)} / ${esc(p.category)}</div><h1>${esc(p.name)}</h1><p class="detail-desc">${esc(p.mm)} · ${esc(p.description)}</p><a href="#parts-buying-guide" class="benefit-jump">↘ ဘာကြောင့် လဲသင့်လဲ? လဲပြီး ဘာကောင်းလာမလဲ?</a><div style="display:flex;gap:9px;align-items:center"><span class="tag ${avail?'':'dark'}">${avail?`✓ IN STOCK — ${p.stock} AVAILABLE`:'OUT OF STOCK'}</span><span class="tag orange">FITMENT REQUIRES CONFIRMATION</span></div><div class="detail-price">${money(p.price)}</div><div class="detail-meta"><div><span>Product SKU</span><strong>${esc(p.sku)}</strong></div><div><span>Reference Part No.</span><strong>${esc(p.partNo)}</strong></div><div><span>Product Condition</span><strong>Sample — condition unverified</strong></div><div><span>Possible Vehicle Types</span><strong>${esc(p.fit.join(', '))}</strong></div></div><div class="detail-callout">${icon('alert')}<span><b>CHECK BEFORE ORDERING:</b> These are demonstration vehicle associations, not verified fitments. Confirm OEM number, engine code, chassis, and physical part dimensions with the actual shop.</span></div><div class="detail-qty"><div class="stepper"><button data-action="detail-minus" aria-label="Decrease quantity">−</button><strong>${selectedQty}</strong><button data-action="detail-plus" aria-label="Increase quantity">+</button></div><button class="btn btn-primary" data-action="detail-add" data-id="${esc(p.id)}" ${avail?'':'disabled'}>${icon('cart')} ADD TO CART</button><button class="favorite ${favorites.includes(p.id)?'active':''}" style="position:static;flex-shrink:0;width:45px;height:45px" data-action="favorite" data-id="${esc(p.id)}" aria-label="Toggle wishlist">${icon('heart')}</button></div><div class="note">${icon('shield',16)} Demo inventory/price. Real orders are disabled until owner configures the secure backend.</div></div></div>${educationContent(p)}${suggestions.length?`<section class="section soft-section" style="padding:38px 0;margin-top:15px"><div class="container">${sectionHeader('YOU MAY ALSO LIKE','RELATED PRODUCTS')}<div class="products-grid">${suggestions.map(productCard).join('')}</div></div></section>`:''}</main>`}
function cartView(){const lines=Object.entries(cart).map(([id,qty])=>({p:getProduct(id),qty})).filter(x=>x.p);return `<main>${pageHead('YOUR SHOPPING CART','Review your selection before demo checkout.')}<div class="container">${bread([{label:'Shopping Cart'}])}${lines.length?`<div class="cart-layout"><div class="table-card"><div class="table-heading"><span>PRODUCT</span><span>QUANTITY</span><span>PRICE</span><span></span></div>${lines.map(({p,qty})=>`<div class="cart-item"><div class="cart-thumb"><img src="${imgPath(p)}" alt="${esc(p.name)}"><div><strong>${esc(p.name)}</strong><small>SKU: ${esc(p.sku)}</small></div></div><div class="stepper"><button data-action="qty-minus" data-id="${p.id}">−</button><strong>${qty}</strong><button data-action="qty-plus" data-id="${p.id}">+</button></div><strong>${fmt(p.price*qty)} Ks</strong><button class="remove" data-action="remove-cart" data-id="${p.id}">REMOVE</button></div>`).join('')}</div><aside class="summary-card">${summaryContent(true)}</aside></div>`:empty('YOUR CART IS EMPTY','Shop products and add parts to your cart.','shop','START SHOPPING') }</div></main>`}
function summaryContent(showButton){return `<h3>ORDER SUMMARY</h3><div class="summary-line"><span>Subtotal (${totalCount()} items)</span><b>${fmt(cartSum())} Ks</b></div><div class="summary-line"><span>Delivery fee</span><b>To be confirmed</b></div><div class="summary-line"><span>Payment</span><b>Demo only</b></div><div class="summary-total"><span>SUBTOTAL</span><strong>${money(cartSum())}</strong></div>${showButton?`<button class="btn btn-primary" data-action="checkout">PROCEED TO DEMO CHECKOUT ${icon('arrow',16)}</button>`:''}<p class="note" style="margin-top:15px">${icon('info',14)} Amounts are illustrative. Delivery and real payments are not enabled.</p>`}
function empty(title,desc,path='shop',label='BROWSE PARTS'){return `<div class="empty">${icon('package')}<h3>${title}</h3><p>${desc}</p><a class="btn btn-primary" href="#/${path}">${label}</a></div>`}
function checkout(){if(!totalCount())return `<main>${pageHead('DEMO CHECKOUT')}<div class="container section">${empty('NO PRODUCTS IN CART','Please add a product before checkout.')}</div></main>`;return `<main>${pageHead('DEMO CHECKOUT','Prototype checkout — no real orders, payments or deliveries.')}<div class="container">${bread([{label:'Cart',path:'cart'},{label:'Checkout'}])}<div class="checkout-layout"><div class="checkout-card"><h3>01 / DEMONSTRATION CUSTOMER DETAILS</h3><div class="warning-note" style="margin-bottom:22px">${icon('alert',17)} Personal data မထည့်ပါနှင့်။ ဤ Form သည် Local Browser Demo အတွက်သာဖြစ်ပါတယ်။ အမည်/ဖုန်း/လိပ်စာ အတုဖြင့်သာ စမ်းပါ။ အော်ဒါအမှန် မပို့ပါ။</div><form id="demo-checkout-form"><div class="checkout-grid"><div class="field"><label>Name (sample only)</label><input name="name" value="Demo Customer" placeholder="Demo Customer" required minlength="2"></div><div class="field"><label>Phone (sample only)</label><input name="phone" value="000000000" placeholder="000000000" required minlength="6"></div><div class="field"><label>Region / State</label><select name="region" required><option>Yangon</option><option>Mandalay</option><option>Magway</option><option>Naypyidaw</option><option>Other</option></select></div><div class="field"><label>Township</label><input name="township" value="Demo Township" required></div><div class="field wide"><label>Sample Delivery Address</label><input name="address" value="Demo address — no real delivery" required></div><div class="field wide"><label>Notes (optional)</label><textarea name="notes" placeholder="Model / engine / part number to check"></textarea></div></div><h3 style="margin:29px 0 14px">02 / DEMONSTRATION PAYMENT</h3><label class="method"><input type="radio" name="payment" value="cod" checked> Cash on Delivery — demonstration only</label><label class="method"><input type="radio" name="payment" value="wallet"> KBZPay / WavePay — manual verification is not connected</label><div class="warning-note" style="margin:14px 0 22px">${icon('info',16)} ဤ Preview တွင် ငွေလွှဲရမည့်အကောင့် မပြထားပါ။ Payment screenshot မတင်ပါနှင့်။</div><button type="submit" class="btn btn-primary" style="width:100%">${icon('check')} PLACE DEMO ORDER</button></form></div><aside class="summary-card">${summaryContent(false)}<div style="margin-top:25px;display:grid;gap:9px">${Object.entries(cart).map(([id,qty])=>{const p=getProduct(id);return p?`<div class="summary-line"><span>${qty} × ${esc(p.name)}</span><b>${fmt(qty*p.price)} Ks</b></div>`:''}).join('')}</div></aside></div></div></main>`}
function success(){const id=route().path.split('/')[1],o=orders.find(x=>x.id===id);return `<main class="container success-page"><div class="success-icon">${icon('check')}</div><div class="section-kicker">DEMO ORDER SAVED ON THIS DEVICE</div><h1>DEMO ORDER CREATED</h1><p>စမ်းသပ် အော်ဒါတစ်ခုကို ဤ Browser ရဲ့ Local Storage ထဲမှာသာ သိမ်းလိုက်ပါတယ်။ <b>ဆိုင်ပိုင်ရှင်ထံ အမှန်တကယ် မရောက်ပါ။</b> ငွေပေးချေရန် မလိုပါ။</p><div class="order-ref">${esc(o?.id||id||'DEMO-ORDER')}</div><a href="#/shop" class="btn btn-primary">CONTINUE SHOPPING ${icon('arrow')}</a> <a href="#/admin" class="btn btn-outline-dark">VIEW DEMO ADMIN</a></main>`}
function wishlist(){const list=products.filter(p=>favorites.includes(p.id));return `<main>${pageHead('MY WISHLIST','Save and compare your favourite products locally.')}<div class="container section">${list.length?`<div class="products-grid">${list.map(productCard).join('')}</div>`:empty('YOUR WISHLIST IS EMPTY','Tap the heart icon on any product to save it.','shop','EXPLORE PRODUCTS')}</div></main>`}
function admin(){const today=new Date().toISOString().slice(0,10),dayOrders=orders.filter(o=>o.createdAt?.slice(0,10)===today);const low=products.filter(p=>p.stock<=5);let content='';if(adminTab==='overview'){content=`<div class="kpi-grid"><div class="kpi">${icon('package')}<span>DEMO PRODUCTS</span><strong>${products.length}</strong></div><div class="kpi">${icon('cart')}<span>DEMO ORDERS</span><strong>${orders.length}</strong></div><div class="kpi">${icon('alert')}<span>LOW STOCK SKUs ≤5</span><strong>${low.length}</strong></div><div class="kpi">${icon('clock')}<span>TODAY DEMO ORDERS</span><strong>${dayOrders.length}</strong></div></div><div class="admin-section"><div class="panel-card"><h3>RECENT DEMO ORDERS</h3>${adminOrdersTable(orders.slice().reverse().slice(0,8))}</div><div class="panel-card"><h3>LOW STOCK ALERTS</h3>${low.length?low.map(p=>`<div class="summary-line"><span>${esc(p.name)}</span><b>${p.stock} left</b></div>`).join(''):'<p class="note">No low-stock SKUs.</p>'}</div></div>`} else if(adminTab==='products'){content=`<div class="panel-card"><h3>PRODUCT INVENTORY</h3><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Product / SKU</th><th>Category</th><th>Price (Ks)</th><th>Stock</th><th>Action</th></tr></thead><tbody>${products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.sku)}</small></td><td>${esc(p.category)}</td><td><input type="number" min="0" step="100" id="price-${p.id}" value="${p.price}"></td><td><input type="number" min="0" max="999999" id="stock-${p.id}" value="${p.stock}"></td><td><button data-action="save-product" data-id="${p.id}">SAVE</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel-card"><h3>ADD DEMO PRODUCT</h3><form id="add-product-form" class="admin-form"><div class="field"><label>Product Title</label><input name="name" required placeholder="Product name"></div><div class="field"><label>SKU</label><input name="sku" required placeholder="SKU-NEW-001"></div><div class="field"><label>Part Number</label><input name="partNo" required placeholder="OEM Reference"></div><div class="field"><label>Price (Ks)</label><input name="price" type="number" min="0" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required></div><div class="field"><label>Category</label><select name="category">${CATEGORIES.map(c=>`<option>${c[0]}</option>`).join('')}</select></div><button class="btn btn-primary" type="submit">${icon('plus')} ADD SAMPLE PRODUCT</button></form></div>`}else if(adminTab==='orders'){content=`<div class="panel-card"><h3>DEMO ORDER LIST</h3>${adminOrdersTable(orders.slice().reverse())}</div>`}else if(adminTab==='reports'){const sum=orders.reduce((s,o)=>s+o.total,0);content=`<div class="kpi-grid"><div class="kpi">${icon('cart')}<span>TOTAL DEMO ORDERS</span><strong>${orders.length}</strong></div><div class="kpi">${icon('package')}<span>DEMO ORDER VALUE</span><strong>${fmt(sum)} Ks</strong></div><div class="kpi">${icon('alert')}<span>LOW STOCK PRODUCTS</span><strong>${low.length}</strong></div><div class="kpi">${icon('list')}<span>CATALOG SIZE</span><strong>${products.length}</strong></div></div><div class="panel-card" style="margin-top:22px"><h3>DATA EXPORT</h3><p class="note">Export local test records as JSON. This is NOT a validated business sales report.</p><button class="btn btn-dark btn-small" data-action="export-data">${icon('download')} EXPORT DEMO JSON</button></div>`} else {content=`<div class="panel-card"><h3>PREVIEW SETTINGS</h3><p>Store name: <b>AUTOPART PRO</b> (placeholder)</p><p>Backend connection: <b>NOT CONNECTED</b></p><p>Live payment gateway: <b>NOT CONNECTED</b></p><p>Customer authentication: <b>NOT CONNECTED</b></p><p class="note">Production build must use a dedicated secure database, authenticated admin accounts, row-level authorization, transactional inventory and verified payment processes. Never use this local demo dashboard as public production admin.</p><button class="btn btn-outline-dark btn-small" data-action="reset-demo">${icon('refresh')} RESET DEMO DATA</button></div>`}
return `<main class="admin-wrap"><aside class="admin-side"><div class="admin-logo">AUTOPART <span>PRO</span><small style="display:block;font:500 10px var(--font);color:#9caab4">LOCAL DEMO DASHBOARD</small></div>${[['overview','dashboard','Overview'],['products','package','Products & Stock'],['orders','list','Demo Orders'],['reports','grid','Demo Reports'],['settings','settings','Settings']].map(([id,ico,label])=>`<button class="admin-nav ${adminTab===id?'active':''}" data-action="admin-tab" data-id="${id}">${icon(ico)} ${label}</button>`).join('')}<button class="admin-nav" data-action="home">${icon('arrow')} Back to Shop</button></aside><div class="admin-content"><div class="admin-header"><div><h1>${({overview:'DASHBOARD',products:'PRODUCT MANAGER',orders:'ORDER MANAGEMENT',reports:'DEMO REPORTS',settings:'STORE SETTINGS'})[adminTab]}</h1><p>Prototype data is stored in this browser only — no server synchronization.</p></div><span class="tag orange">LOCAL DEMO · NOT SECURE ADMIN</span></div><div class="alert">${icon('alert',16)} Admin Preview only. No authentication or shared cloud database is active. Product edits and demo orders affect this device only.</div>${content}</div></main>`}
function adminOrdersTable(list){return list.length?`<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Reference</th><th>Items</th><th>Demo Total</th><th>Local Status</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.id)}</b><br><small>${esc(o.createdAt?.slice(0,16).replace('T',' ')||'')}</small></td><td>${o.items.length}</td><td>${fmt(o.total)} Ks</td><td><select data-action="order-status" data-id="${esc(o.id)}"><option ${o.status==='Demo pending'?'selected':''}>Demo pending</option><option ${o.status==='Demo confirmed'?'selected':''}>Demo confirmed</option><option ${o.status==='Demo cancelled'?'selected':''}>Demo cancelled</option></select></td></tr>`).join('')}</tbody></table></div>`:'<p class="note">No local demo orders yet.</p>'}
function overlays(){if(mobileMenu)return `<div class="overlay" data-action="close-overlay"></div><aside class="mobile-overlay-menu"><div class="drawer-head" style="padding:8px 0 20px"><div class="brand">${mark()}</div><button class="x-btn" data-action="close-overlay">${icon('close')}</button></div>${[['home','grid','Home'],['shop','package','All Products'],['find-parts','car','Find My Fit'],['wishlist','heart','Wishlist'],['cart','cart','Shopping Cart'],['admin','dashboard','Demo Admin']].map(([path,ico,label])=>`<button class="mobile-nav-link" data-action="mobile-go" data-id="${path}">${icon(ico)} ${label}</button>`).join('')}</aside>`;if(!drawer)return '';const lines=(drawer==='cart'?Object.entries(cart).map(([id,qty])=>({p:getProduct(id),qty})):favorites.map(id=>({p:getProduct(id),qty:1}))).filter(x=>x.p);return `<div class="overlay" data-action="close-overlay"></div><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><h3>${drawer==='cart'?'MY SHOPPING CART':'MY WISHLIST'} (${lines.length})</h3><button class="x-btn" data-action="close-overlay" aria-label="Close drawer">${icon('close')}</button></div><div class="drawer-body">${lines.length?lines.map(({p,qty})=>`<div class="drawer-item"><img src="${imgPath(p)}" alt="${esc(p.name)}"><div class="info"><strong>${esc(p.name)}</strong><small>${fmt(p.price)} Ks ${drawer==='cart'?`× ${qty}`:''}</small></div><button class="x-btn" data-action="${drawer==='cart'?'remove-cart':'favorite'}" data-id="${p.id}">${icon('close',15)}</button></div>`).join(''):empty('NO ITEMS YET','Browse our sample products and add your favourites.')}</div><div class="drawer-foot"><div class="summary-total"><span>${drawer==='cart'?'SUBTOTAL':'SAVED PRODUCTS'}</span><strong>${drawer==='cart'?money(cartSum()):lines.length}</strong></div><button class="btn btn-primary" data-action="${drawer==='cart'?'cart':'wishlist'}">${drawer==='cart'?'VIEW SHOPPING CART':'VIEW WISHLIST'} ${icon('arrow',16)}</button>${drawer==='cart'&&lines.length?`<button class="btn btn-outline-dark" data-action="checkout">DEMO CHECKOUT</button>`:''}</div></aside>`}
function toasts(){return toastItems.length?`<div class="toast-stack" role="status">${toastItems.map(t=>`<div class="toast">${icon('check',16)} ${esc(t.message)}</div>`).join('')}</div>`:''}
function render(){const r=route().path;const view=r===''?home():r==='shop'?catalog():r==='find-parts'?findParts():r.startsWith('product/')?detail():r==='cart'?cartView():r==='checkout'?checkout():r.startsWith('order-success/')?success():r==='wishlist'?wishlist():r==='admin'?admin():`<main class="container section">${empty('PAGE NOT FOUND','Please return to our catalogue.')}</main>`;app.innerHTML=header()+view+footer()+mobileBottom()+overlays()+toasts();document.title=(r?`${r.split('/')[0].toUpperCase()} | `:'')+'AutoPart Pro — Automotive Parts';}
function toast(message){const id=Date.now()+Math.random();toastItems.push({id,message});render();setTimeout(()=>{toastItems=toastItems.filter(x=>x.id!==id);render()},2400)}
function addCart(id,qty=1){const p=getProduct(id);if(!p||p.stock<=0)return toast('This product is out of stock');const next=(cart[id]||0)+qty;if(next>p.stock)return toast(`Only ${p.stock} available in demo stock`);cart[id]=next;save('cart',cart);toast('Added to your cart')}
function changeQty(id,change){const p=getProduct(id);if(!p)return;const next=(cart[id]||0)+change;if(next<=0)delete cart[id];else if(next>p.stock)return toast('Cannot exceed available stock');else cart[id]=next;save('cart',cart);render()}
function productCategory(next){let params=route().params;params.set('category',next);params.delete('vehicle');const q=params.toString();to('shop'+(q?'?'+q:''))}
function doVehicle(form){const d=new FormData(form),brand=String(d.get('brand')||''),model=String(d.get('model')||''),year=String(d.get('year')||''),cat=String(d.get('category')||'');if(!brand||!model)return toast('Please choose brand and model');let params=new URLSearchParams({vehicle:`${brand} ${model}`});if(cat)params.set('category',cat);to('shop?'+params.toString());toast(`Showing indicative parts for ${brand} ${model}${year?' '+year:''}. Verify fitment before ordering.`)}
function exportDemo(){const blob=new Blob([JSON.stringify({products,orders,note:'DEMO ONLY. Browser local data, not real customer orders.'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='autopart-pro-demo.json';a.click();URL.revokeObjectURL(a.href)}
app.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(!target)return;const act=target.dataset.action,id=target.dataset.id;ev.preventDefault();switch(act){case'mobile-menu':mobileMenu=true;render();break;case'close-overlay':drawer=null;mobileMenu=false;render();break;case'open-cart':drawer='cart';render();break;case'wishlist':drawer==='wishlist'?to('wishlist'):(drawer='wishlist',render());break;case'open-admin':to('admin');break;case'home':to('');break;case'shop':to('shop');break;case'cart':to('cart');break;case'find-parts':to('find-parts');break;case'checkout':to('checkout');break;case'mobile-go':to(id==='home'?'':id);break;case'product':selectedQty=1;to('product/'+id);break;case'category':productCategory(id);break;case'favorite':favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('favorites',favorites);render();break;case'add-cart':addCart(id,1);break;case'detail-minus':selectedQty=Math.max(1,selectedQty-1);render();break;case'detail-plus':selectedQty=Math.min(99,selectedQty+1);render();break;case'detail-add':addCart(id,selectedQty);break;case'qty-plus':changeQty(id,1);break;case'qty-minus':changeQty(id,-1);break;case'remove-cart':delete cart[id];save('cart',cart);render();break;case'admin-tab':adminTab=id;render();break;case'save-product':{const p=getProduct(id),price=Number(document.getElementById('price-'+id)?.value),stock=Number(document.getElementById('stock-'+id)?.value);if(!p||!Number.isSafeInteger(price)||price<0||!Number.isSafeInteger(stock)||stock<0)return toast('Enter valid non-negative price and stock');p.price=price;p.stock=stock;save('products',products);toast('Local demo product updated');break}case'order-status':break;case'export-data':exportDemo();break;case'reset-demo':{if(!window.confirm('Reset only local demo products, cart and orders on this browser?'))return;products=structuredClone(BASE_PRODUCTS);orders=[];cart={};favorites=[];save('products',products);save('orders',orders);save('cart',cart);save('favorites',favorites);toast('Demo reset successfully');break;}default:break}});
app.addEventListener('change',e=>{if(e.target.id==='vehicle-brand'){const sel=app.querySelector('#vehicle-model');if(sel){const models=VEHICLES[e.target.value]||[];sel.innerHTML='<option value="">Select Model</option>'+models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}}if(e.target.name==='catalog-category')productCategory(e.target.value);if(e.target.id==='mobile-category')productCategory(e.target.value);if(e.target.id==='sort-products'){sortBy=e.target.value;render()}if(e.target.id==='stock-only'){stockOnly=e.target.checked;render()}if(e.target.dataset.action==='order-status'){const o=orders.find(o=>o.id===e.target.dataset.id);if(o){o.status=e.target.value;save('orders',orders);toast('Demo order status updated')}}});
app.addEventListener('submit',e=>{const id=e.target.id;if(!['global-search-form','part-search-form','vehicle-form','demo-checkout-form','add-product-form'].includes(id))return;e.preventDefault();const d=new FormData(e.target);if(id==='global-search-form'||id==='part-search-form'){const q=String(d.get('q')||'').trim();if(q)to('shop?search='+encodeURIComponent(q));else to('shop')}if(id==='vehicle-form')doVehicle(e.target);if(id==='demo-checkout-form'){if(!totalCount())return to('cart');const invalid=Object.entries(cart).find(([pid,qty])=>{const p=getProduct(pid);return !p||qty<1||qty>p.stock});if(invalid)return toast('One product has insufficient demo stock. Update your cart.');const newOrder={id:'DEMO-'+Date.now().toString().slice(-9),createdAt:new Date().toISOString(),status:'Demo pending',items:Object.entries(cart).map(([pid,qty])=>({id:pid,qty,price:getProduct(pid).price})),total:cartSum(),paymentMethod:d.get('payment')};orders.push(newOrder);save('orders',orders);cart={};save('cart',cart);to('order-success/'+newOrder.id)}if(id==='add-product-form'){const name=String(d.get('name')||'').trim(),sku=String(d.get('sku')||'').trim().toUpperCase(),partNo=String(d.get('partNo')||'').trim(),category=String(d.get('category')||'Engine'),price=Number(d.get('price')),stock=Number(d.get('stock'));if(!name||!sku||!partNo||!Number.isSafeInteger(price)||price<0||!Number.isSafeInteger(stock)||stock<0)return toast('Please fill valid product fields');if(products.some(p=>p.sku===sku))return toast('SKU must be unique');const idx='AP-C'+Date.now();products.push({id:idx,slug:'sample-'+idx.toLowerCase(),name,mm:'နမူနာပစ္စည်း',category,brand:'SAMPLE',sku,partNo,price,stock,image:category==='Brakes'?'brake-disc.svg':category==='Filters'?'oil-filter.svg':'engine.svg',fit:[],badge:'NEW',description:'Locally added demonstration product. Real fitment and authenticity not verified.'});save('products',products);toast('Demo product added')}});
window.addEventListener('hashchange',()=>{selectedQty=1;drawer=null;mobileMenu=false;render();window.scrollTo({top:0,behavior:'instant'})});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&(drawer||mobileMenu)){drawer=null;mobileMenu=false;render()}});
render();

</script>
