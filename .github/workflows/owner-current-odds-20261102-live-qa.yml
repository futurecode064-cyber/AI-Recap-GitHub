name: Owner Current Prices Nov 02 — Six Website Live Browser QA
on:
  push:
    branches: [football-daily-render]
    paths: ['.github/workflows/owner-current-odds-20261102-live-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate owner source and original-current price identity joins
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const root='football-daily/data/';
          const o=JSON.parse(readFileSync(root+'odds/2026-11-02.json'));
          const t=JSON.parse(readFileSync(root+'today.json'));
          const s=JSON.parse(readFileSync(root+'odds/evening/2026-11-02.json'));
          assert.equal(o.reportDate,'2026-11-02');
          assert.equal(t.reportDate,o.reportDate);
          assert.equal(s.reportDate,o.reportDate);
          assert.equal(s.sourceFile,'2 စျေး.pdf');
          assert.equal(o.matches.length,16);
          assert.equal(s.matches.length,16);
          const by=new Map(t.matches.map(x=>[x.fixtureId,x]));
          const updates=new Map(s.matches.map(x=>[x.fixtureId,x]));
          assert.equal(updates.size,16);
          for(const m of o.matches){
            const x=by.get(m.fixtureId),e=updates.get(m.fixtureId);
            assert(x&&e,"Unmatched fixture "+m.fixtureId);
            assert.equal(m.home,x.homeDisplay);assert.equal(m.away,x.awayDisplay);
            for(const [a,b] of [['bodyOdds','morningBodyOdds'],['goalTotalOdds','morningGoalTotalOdds']])assert.equal(m[a],e[b]);
            for(const [a,b] of [['currentBodyOdds','eveningBodyOdds'],['currentGoalTotalOdds','eveningGoalTotalOdds']]){
              assert.equal(m[a],e[b]);assert.equal(x.myanmarOdds[a],m[a]);
              assert(/^(?:-\d+|\d+[+-]\d+|\d+=)$/.test(m[a]),"Bad owner quote "+m.fixtureId+" "+m[a]);
            }
            assert.equal(m.kickoffDisplay,e.kickoffDisplay);
            assert.equal(m.upperTeam,e.upperTeam);
            assert.equal(m.currentPriceSourcePdf,'2 စျေး.pdf');
          }
          console.log('OWNER PDF CURRENT PRICES: 16/16 MATCHED AND COMPLETE');
          NODE
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify live prices on Main and five active brand websites
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const odds=JSON.parse(readFileSync('football-daily/data/odds/2026-11-02.json'));
          const targetPrices=odds.matches.flatMap(m=>[m.currentBodyOdds,m.currentGoalTotalOdds]).sort();
          const targetMorning=odds.matches.flatMap(m=>[m.bodyOdds,m.goalTotalOdds]).sort();
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const base='https://future-code-football-daily.pages.dev';
          const paths=['/odds.html','/future-code-journal/odds.html','/ykz-family/odds.html','/bw-sport/odds.html','/ko-thet-family/odds.html','/kmm-sport-hub/odds.html'];
          try{
           const context=await browser.newContext({viewport:{width:1440,height:1000},deviceScaleFactor:1});
           for(const path of paths){
            const page=await context.newPage();
            await page.goto(base+path+'?date=2026-11-02',{waitUntil:'domcontentloaded',timeout:65000});
            await page.waitForFunction(()=>document.querySelectorAll('#oddsList td.odds-current').length===32,{timeout:45000}).catch(async e=>{
              throw new Error(path+' has not shown all 32 latest-price cells; DOM '+await page.locator('#oddsList').innerText().catch(()=>'?')+'; '+e.message);
            });
            const actual=(await page.locator('#oddsList td.odds-current').allTextContents()).map(x=>x.trim()).sort();
            const morning=(await page.locator('#oddsList td.odds-original').allTextContents()).map(x=>x.trim()).sort();
            assert.deepEqual(actual,targetPrices,path+' latest price cells differ from owner PDF');
            assert.deepEqual(morning,targetMorning,path+' original morning prices changed');
            const caption=(await page.locator('#oddsCount').innerText()).trim();
            const name=path.replaceAll('/','-').replace(/^-|-$/g,'')||'main';
            await page.locator('#oddsList').screenshot({path:'odds-current-20261102-'+name+'.png',timeout:45000});
            console.log('PASS',path,'16 fixtures; 32 latest prices; 32 original prices; count:',caption);
            await page.close();
           }
          }finally{await browser.close();}
          NODE
      - name: Save six website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-current-odds-six-sites-20261102
          path: odds-current-20261102-*.png
          if-no-files-found: ignore
