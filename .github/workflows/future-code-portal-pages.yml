name: Future Code Student and Admin Web Portals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'training-app/assets/**'
      - 'scripts/build_portal.py'
      - 'tests/**'
      - '.github/workflows/future-code-portal-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: future-code-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current web sections and verify routing
        run: |
          python3 scripts/build_portal.py
          python3 tests/validate_assets.py
          node tests/studio.test.js
          node tests/access.test.js
          node tests/portal.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
