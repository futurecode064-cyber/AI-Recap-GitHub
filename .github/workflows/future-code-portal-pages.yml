name: Future Code Student and Admin Web Portals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'web-preview/index.html'
      - '.github/workflows/future-code-portal-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: future-code-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publicly accessible student and admin portals
        run: |
          curl --fail --location --retry 2 --silent --show-error --output /tmp/academy-v4.zip https://futurecode-movie-recap.floot.app/_cdn/static/6bb4561c-f3e3-409c-86f5-b4c296968e40-future-code-video-studio-beta-v4-standalone.zip
          unzip -q /tmp/academy-v4.zip
          curl --fail --location --retry 2 --silent --show-error --output /tmp/academy-v5-patch.zip https://futurecode-movie-recap.floot.app/_cdn/static/815b544d-ada4-4c6b-aa5a-2c5c79ea0850-future-code-studio-beta5-update.zip
          unzip -q -o /tmp/academy-v5-patch.zip
          curl --fail --location --retry 2 --silent --show-error --output /tmp/recap-pro-v6.zip https://futurecode-movie-recap.floot.app/_cdn/static/251f2da7-c615-47a6-91fc-ef47634a5227-future-code-recap-pro-beta6-patch.zip
          unzip -q -o /tmp/recap-pro-v6.zip
          grep -q 'Movie Recap Pro Editor' video_studio_rebuild/training-app/assets/sections/recap-studio.html
          mkdir -p portal/recap portal/image-studio portal/image-guide portal/video-maker portal/video-guide
          cp video_studio_rebuild/training-app/assets/sections/recap-studio.html portal/recap/index.html
          cp video_studio_rebuild/training-app/assets/sections/image-studio.html portal/image-studio/index.html
          cp video_studio_rebuild/training-app/assets/sections/image-studio-guide.html portal/image-guide/index.html
          cp video_studio_rebuild/training-app/assets/sections/video-maker.html portal/video-maker/index.html
          cp video_studio_rebuild/training-app/assets/sections/video-maker-guide.html portal/video-guide/index.html
          test -s portal/student/index.html
          test -s portal/admin/index.html
          test -s portal/recap/index.html
          test -s portal/image-studio/index.html
          test -s portal/image-guide/index.html
          test -s portal/video-maker/index.html
          test -s portal/video-guide/index.html
          test -s portal/recap-guide/index.html
          touch portal/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
