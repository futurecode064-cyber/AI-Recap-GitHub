name: Main Results V2 — Exact V1 Card and PNG Browser QA
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/main-results-v2-live-qa.yml'
      - 'football-daily/tests/main-results-v2-live-qa.cjs'
      - 'football-daily/main-results-v2.js'
      - 'football-daily/app.js'
      - 'football-daily/index.html'
      - 'football-daily/main-editorial-choice.js'
      - 'football-daily/frame-preview-renderer.js'
      - 'football-daily/data/archive/2026-11-09.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Results V2 JavaScript syntax
        run: |
          node --check football-daily/main-results-v2.js
          node --check football-daily/app.js
          node --check football-daily/tests/main-results-v2-live-qa.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Read-only browser check — original card and circled score + PNG
        run: node football-daily/tests/main-results-v2-live-qa.cjs
      - name: Preserve screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-results-v2-browser-screenshot
          path: results-v2-live-first-match.png
          if-no-files-found: ignore
