name: Football Daily Verified Score Sync
on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-daily-score-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out football website branch
        uses: actions/checkout@v4
        with:
          ref: football-daily-render
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified scores and match history
        run: python football-daily/scripts/sync_scores.py
      - name: Publish verified JSON changes
        run: |
          git add football-daily/data/today.json football-daily/data/archive/
          if git diff --cached --quiet; then
            echo "No verified score updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "football: sync verified scores and historical results"
          git push origin HEAD:football-daily-render
