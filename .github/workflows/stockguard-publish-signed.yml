name: StockGuard - Signed APK and Update Channel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stockguard/project/**'
      - '.github/workflows/stockguard-publish-signed.yml'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore or initialize permanent StockGuard signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p stockguard/signing
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-stockguard-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-stockguard-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/stockguard-key-info.json
          if [ "$(jq -r '.ready' /tmp/stockguard-key-info.json)" != "true" ]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12 -keystore /tmp/stockguard-create.p12 -storepass "$PASS" -keypass "$PASS" -alias stockguard -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Future Code StockGuard, O=Future Code AI Studio, C=MM" -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/stockguard-create.p12)" '{action:"initialize",store_password:$pass,keystore_b64:$b64}' > /tmp/stockguard-init.json
            curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/stockguard-init.json "$API" -o /tmp/stockguard-init-result.json
            jq -e '.ok == true' /tmp/stockguard-init-result.json >/dev/null
            curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/stockguard-key-info.json
          fi
          jq -e '.ready == true and .key_alias == "stockguard"' /tmp/stockguard-key-info.json >/dev/null
          jq -er '.keystore_b64' /tmp/stockguard-key-info.json | base64 --decode > stockguard/signing/release.jks
          PASS="$(jq -er '.store_password' /tmp/stockguard-key-info.json)"
          echo "::add-mask::$PASS"
          echo "STOCKGUARD_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "STOCKGUARD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          rm -f /tmp/stockguard-key-info.json /tmp/stockguard-init.json /tmp/stockguard-init-result.json /tmp/stockguard-create.p12
      - name: Build unsigned release APK
        working-directory: stockguard/project
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Align sign verify hash and package source
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=stockguard/project/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGN=stockguard/signing/app-aligned.apk
          SIGNED=stockguard/signing/app-signed.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$UNSIGNED"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGN"
          "$TOOLS/apksigner" sign --ks stockguard/signing/release.jks --ks-key-alias stockguard --ks-pass env:STOCKGUARD_STORE_PASSWORD --key-pass env:STOCKGUARD_KEY_PASSWORD --out "$SIGNED" "$ALIGN"
          "$TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          "$TOOLS/aapt" dump badging "$SIGNED" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)'
          mkdir -p stockguard/releases
          cp "$SIGNED" stockguard/releases/FutureCodeStockGuard-v1.0.0.apk
          rm -f stockguard/FutureCodeStockGuard-v1.0.0-source.zip
          (cd stockguard/project && zip -qr ../FutureCodeStockGuard-v1.0.0-source.zip . -x '*/build/*' '.gradle/*')
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib
          apk=pathlib.Path('stockguard/releases/FutureCodeStockGuard-v1.0.0.apk')
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          update={
            'packageName':'com.futurecode.stockguard',
            'versionCode':1,
            'versionName':'1.0.0',
            'notes':'Offline inventory, barcode sales, daily profit, low-stock dashboard, CSV and JSON backup',
            'apkUrl':'https://raw.githubusercontent.com/futurecode064-cyber/AI-Recap-GitHub/main/stockguard/releases/FutureCodeStockGuard-v1.0.0.apk',
            'sha256':sha,
            'publishedAt':datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          }
          pathlib.Path('stockguard/latest.json').write_text(json.dumps(update,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path('stockguard/release-sha256.txt').write_text(sha+'  FutureCodeStockGuard-v1.0.0.apk\n')
          print('APK SHA256',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FutureCode-StockGuard-v1.0.0
          path: |
            stockguard/releases/FutureCodeStockGuard-v1.0.0.apk
            stockguard/FutureCodeStockGuard-v1.0.0-source.zip
            stockguard/latest.json
            stockguard/release-sha256.txt
          if-no-files-found: error
      - name: Publish verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stockguard/releases/ stockguard/FutureCodeStockGuard-v1.0.0-source.zip stockguard/latest.json stockguard/release-sha256.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish StockGuard v1.0.0 signed release [skip ci]"
            git push origin HEAD:main
          fi
