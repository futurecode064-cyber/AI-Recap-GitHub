name: Future Code QueuePro Android Build and Signed Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "queuepro/project/**"
      - "queuepro/test/**"
      - ".github/workflows/queuepro-release.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline QueuePro engine tests
        working-directory: queuepro/test
        run: |
          npm install --no-save --no-audit --no-fund jsdom@25.0.1 fake-indexeddb@6.0.1
          node smoke.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android APKs
        working-directory: queuepro/project
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Upload preview APK for QA
        uses: actions/upload-artifact@v4
        with:
          name: QueuePro-debug-APK-not-for-public-release
          path: queuepro/project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Check stable release signing secrets
        id: keys
        env:
          KEY: ${{ secrets.QUEUEPRO_KEYSTORE_B64 }}
          PASS: ${{ secrets.QUEUEPRO_STORE_PASSWORD }}
          ALIAS: ${{ secrets.QUEUEPRO_KEY_ALIAS }}
          KEYPASS: ${{ secrets.QUEUEPRO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASS" ] && [ -n "$ALIAS" ] && [ -n "$KEYPASS" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::warning::Production release skipped: permanent signing credentials not set"; fi
      - name: Align sign verify package
        if: steps.keys.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.QUEUEPRO_KEYSTORE_B64 }}
          PASS: ${{ secrets.QUEUEPRO_STORE_PASSWORD }}
          ALIAS: ${{ secrets.QUEUEPRO_KEY_ALIAS }}
          KEYPASS: ${{ secrets.QUEUEPRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/queuepro.jks"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p portal/apps
          "$TOOLS/zipalign" -f -p 4 queuepro/project/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/queuepro-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/queuepro.jks" --ks-key-alias "$ALIAS" --ks-pass env:PASS --key-pass env:KEYPASS --out portal/apps/FutureCodeQueuePro-v1.0.0.apk "$RUNNER_TEMP/queuepro-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs portal/apps/FutureCodeQueuePro-v1.0.0.apk
          "$TOOLS/aapt" dump badging portal/apps/FutureCodeQueuePro-v1.0.0.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:)'
          python3 - <<'PY'
          import json,hashlib,pathlib,datetime
          f=pathlib.Path('portal/apps/FutureCodeQueuePro-v1.0.0.apk')
          meta={'packageName':'com.futurecode.queuepro','versionName':'1.0.0','versionCode':1,'size':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'apkUrl':'https://futurecode064-cyber.github.io/AI-Recap-GitHub/apps/FutureCodeQueuePro-v1.0.0.apk','publishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('queuepro/latest.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('Verified SHA256:',meta['sha256'])
          PY
      - name: Signed APK QA artifact
        if: steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: QueuePro-signed-verified-v1.0.0
          path: |
            portal/apps/FutureCodeQueuePro-v1.0.0.apk
            queuepro/latest.json
      - name: Publish signed release to download website
        if: steps.keys.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/apps/FutureCodeQueuePro-v1.0.0.apk queuepro/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish QueuePro verified signed APK [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
