name: Future Code Language Academy Android
on:
  push:
    branches: [main]
    paths:
      - 'portal/apps/languages/**'
      - '!portal/apps/languages/latest.json'
      - 'language-apk/**'
      - '.github/workflows/fc-language-academy-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          VER="$(sed -n 's/.*versionName=\"\([^\"]*\)\".*/\1/p' language-apk/AndroidManifest.xml | head -n1)"
          test -n "$VER"
          echo "APK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APK_NAME=Future_Code_Language_Academy_v$VER.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=fc-language-academy-v$VER" >> "$GITHUB_ENV"
      - name: Prepare bundled pronunciation in all 12 languages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install edge-tts==7.3.1
          python3 scripts/generate_offline_audio.py academy language-apk/assets/audio
      - name: Compile offline language learning APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p language-apk/assets out build-language/generated build-language/classes build-language/dex
          cp portal/apps/languages/index.html language-apk/assets/index.html
          "$BT/aapt2" compile --dir language-apk/res -o build-language/resources.zip
          "$BT/aapt2" link -I "$AJ" --manifest language-apk/AndroidManifest.xml -A language-apk/assets -o build-language/unsigned.apk --java build-language/generated build-language/resources.zip
          find language-apk/src build-language/generated -name '*.java' > build-language/sources.txt
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$AJ" -d build-language/classes @build-language/sources.txt
          find build-language/classes -name '*.class' -print0 | xargs -0 "$BT/d8" --lib "$AJ" --min-api 26 --output build-language/dex
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("build-language/unsigned.apk","a",zipfile.ZIP_DEFLATED) as z:
              for p in Path("build-language/dex").glob("*.dex"):
                  z.write(p,p.name)
          PY
          "$BT/zipalign" -f -p 4 build-language/unsigned.apk build-language/aligned.apk
      - name: Verify all 12-language voice files are embedded
        run: python3 scripts/verify_offline_audio_apk.py build-language/aligned.apk 216
      - name: Sign Language Academy with private persistent signing key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-language-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-language-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-language-sign.json
          if [[ "$(jq -r '.ready' /tmp/fc-language-sign.json)" != "true" ]]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12 -keystore /tmp/fc-language-init.p12 -storepass "$PASS" -keypass "$PASS" -alias future-code-language -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Future Code Language Academy,O=Future Code,C=MM' -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/fc-language-init.p12)" '{action:"initialize",store_password:$pass,keystore_b64:$b64}' > /tmp/fc-language-init.json
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/fc-language-init.json "$API" -o /tmp/fc-language-initialized.json
            jq -e '.ok == true' /tmp/fc-language-initialized.json >/dev/null
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-language-sign.json
          fi
          jq -e '.ready == true' /tmp/fc-language-sign.json >/dev/null
          jq -er '.keystore_b64' /tmp/fc-language-sign.json | base64 -d > /tmp/fc-language-key.p12
          ANDROID_KEYSTORE_PASS="$(jq -er '.store_password' /tmp/fc-language-sign.json)"
          SIGN_ALIAS="$(jq -er '.key_alias' /tmp/fc-language-sign.json)"
          echo "::add-mask::$ANDROID_KEYSTORE_PASS"
          export ANDROID_KEYSTORE_PASS
          mkdir -p out
          APK_NAME="Future_Code_Language_Academy_v$APK_VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/fc-language-key.p12 --ks-key-alias "$SIGN_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS --out "out/$APK_NAME" build-language/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "out/$APK_NAME"
          sha256sum "out/$APK_NAME" > out/SHA256SUMS.txt
          shred -u /tmp/fc-language-sign.json /tmp/fc-language-key.p12 /tmp/fc-language-init.p12 /tmp/fc-language-init.json /tmp/fc-language-initialized.json 2>/dev/null || true
      - name: Verify original certificate and complete neural speech coverage
        run: python3 scripts/verify_language_release.py academy "out/$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-Language-Academy-Official-v${{ env.APK_VERSION }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish official stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official release preserved (including download counts)."
            exit 0
          fi
          gh release create "$TAG" out/$APK_NAME out/SHA256SUMS.txt --title "Future Code Language Academy $APK_VERSION" --notes "Stable private signing certificate for all future APK upgrades. 12-language foundation curriculum, 30 phrases per language, speech practice, writing, quiz and progress backup/restore. Android 8+ offline lessons. Previous v1.0.0 TEST APK uses a different signing key: backup your progress and uninstall the preview before installing official release. Android confirmation required."

