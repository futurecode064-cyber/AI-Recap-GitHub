name: Future Code Football Daily Guard

# Manual-only legacy guard: scheduled writes to old production removed to prevent
# overwriting the authoritative standalone repo or causing sync conflicts.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a safe new-day rollover or audit the current report'
        required: true
        type: choice
        default: audit
        options:
          - rollover
          - audit

permissions:
  contents: write

concurrency:
  group: future-code-football-daily-guard
  cancel-in-progress: false

jobs:
  guard:
    name: Yangon Daily Data Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out football website branch
        uses: actions/checkout@v4
        with:
          ref: football-daily-render
          fetch-depth: 1
          persist-credentials: true

      - name: Validate or roll over report
        shell: bash
        env:
          EVENT_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_CRON" == '25 23 * * *' || "$MANUAL_MODE" == 'rollover' ]]; then
            echo 'Running pre-6AM safe rollover; no invented previews are generated.'
            python3 football-daily/scripts/daily_guard.py rollover
          else
            echo 'Running post-6AM publish audit.'
            python3 football-daily/scripts/daily_guard.py audit
          fi

      - name: Commit only new-day placeholder if needed
        if: ${{ github.event.schedule == '25 23 * * *' || inputs.mode == 'rollover' }}
        shell: bash
        run: |
          set -euo pipefail
          git add football-daily/data/today.json
          if git diff --cached --quiet; then
            echo 'No report changes needed.'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(football): start new Yangon match-report day'
            git push origin HEAD:football-daily-render
          fi

      - name: Explain audit failure
        if: failure()
        run: |
          echo '## Football daily audit failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The website shows no old previews by design. Check the ChatGPT 6AM task and the JSON at football-daily/data/today.json on the football-daily-render branch.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No fixtures, odds, news, or betting picks were invented.' >> "$GITHUB_STEP_SUMMARY"
