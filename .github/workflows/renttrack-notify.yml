name: RentTrack Owner Notification Broadcast
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title (maximum 90 characters)'
        required: true
        type: string
      message:
        description: 'Notification message (maximum 500 characters)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: renttrack-owner-notification
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ inputs.title }}
      BODY: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stage notification
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,time,pathlib,re,secrets
          title=os.environ.get('TITLE','').strip()
          body=os.environ.get('BODY','').strip()
          if not 1<=len(title)<=90 or not 1<=len(body)<=500:
            raise SystemExit('Title or message length invalid')
          if any(ord(c)<32 and c not in '\n\t' for c in title+body):
            raise SystemExit('Control characters not allowed')
          now=int(time.time())
          doc={'status':'active','id':'renttrack-'+str(now)+'-'+secrets.token_hex(4),
           'title':title,'body':body,'publishedAt':now,'expiresAt':now+48*3600}
          pathname=pathlib.Path('portal/apps/renttrack-announcement.json')
          pathname.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n')
          print('OWNER_NOTIFICATION_STAGED',doc['id'],'length',len(title),len(body))
          PY
      - name: Publish to Future Code website feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/apps/renttrack-announcement.json
          git commit -m 'RentTrack owner announcement [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
