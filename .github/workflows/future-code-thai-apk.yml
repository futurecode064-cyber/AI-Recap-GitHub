name: Future Code Thai Speaking Android APK
on:
  push:
    branches: [main]
    paths:
      - 'thai-course/**'
      - 'portal/thai-course/**'
      - '.github/workflows/future-code-thai-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          VER="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" thai-course/app/build.gradle | head -n1)"
          test -n "$VER"
          echo "APK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APK_NAME=Future_Code_Thai_Speaking_v$VER.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=future-code-thai-speaking-v$VER" >> "$GITHUB_ENV"
      - name: Verify Thai curriculum and metadata
        run: |
          node --check portal/thai-course/course.js
          node --check portal/thai-course/sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("portal/thai-course")
          assert len((p/"course.js").read_text()) > 14000
          for name in ("latest","notice"):
              data=json.loads((p/(name+".json")).read_text())
              assert data
          assert (p/"thai-icon.svg").exists()
          print("PASS Thai course source and update manifests")
          PY
      - name: Bundle offline Thai lessons
        run: |
          mkdir -p thai-course/app/src/main/assets
          cp portal/thai-course/index.html portal/thai-course/course.js \
            portal/thai-course/thai-icon.svg portal/thai-course/manifest.webmanifest \
            portal/thai-course/latest.json thai-course/app/src/main/assets/
      - name: Build Android beta APK
        working-directory: thai-course
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-Thai-Speaking-Beta-Debug-APK
          path: thai-course/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Assemble permanent-key release APK
        working-directory: thai-course
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign official Thai APK with private persistent signing key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-thai-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-thai-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-thai-sign.json
          if [[ "$(jq -r '.ready' /tmp/fc-thai-sign.json)" != "true" ]]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12 -keystore /tmp/fc-thai-init.p12 -storepass "$PASS" -keypass "$PASS" -alias future-code-thai -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Future Code Thai Speaking,O=Future Code,C=MM' -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/fc-thai-init.p12)" '{action:"initialize",store_password:$pass,keystore_b64:$b64}' > /tmp/fc-thai-init.json
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/fc-thai-init.json "$API" -o /tmp/fc-thai-initialized.json
            jq -e '.ok == true' /tmp/fc-thai-initialized.json >/dev/null
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-thai-sign.json
          fi
          jq -e '.ready == true' /tmp/fc-thai-sign.json >/dev/null
          jq -er '.keystore_b64' /tmp/fc-thai-sign.json | base64 -d > /tmp/fc-thai-key.p12
          ANDROID_KEYSTORE_PASS="$(jq -er '.store_password' /tmp/fc-thai-sign.json)"
          SIGN_ALIAS="$(jq -er '.key_alias' /tmp/fc-thai-sign.json)"
          echo "::add-mask::$ANDROID_KEYSTORE_PASS"
          export ANDROID_KEYSTORE_PASS
          mkdir -p out
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 thai-course/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/fc-thai-aligned.apk
          "$BT/apksigner" sign --ks /tmp/fc-thai-key.p12 --ks-key-alias "$SIGN_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS --out out/$APK_NAME /tmp/fc-thai-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs out/$APK_NAME
          sha256sum out/*.apk > out/SHA256SUMS.txt
          shred -u /tmp/fc-thai-sign.json /tmp/fc-thai-key.p12 /tmp/fc-thai-init.p12 /tmp/fc-thai-init.json /tmp/fc-thai-initialized.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-Thai-Speaking-Official-v${{ env.APK_VERSION }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable official Thai release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official release preserved; no changed signing identity or download counter."
            exit 0
          fi
          gh release create "$TAG" out/$APK_NAME out/SHA256SUMS.txt --title "Future Code Thai Speaking $APK_VERSION" --notes "Stable private signing certificate for all future releases. Android 8+; 18 lessons plus expanded dialogue practice, Thai pronunciation, writing, quiz, flashcards and offline fallback. Android approval required for updates. Users coming from the differently signed v1.0.0 debug beta must back up progress and uninstall the beta before installing this stable release."

