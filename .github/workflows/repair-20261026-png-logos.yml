name: Repair Oct 26 frame PNG crests on LIVE Pages branch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-20261026-png-logos.yml']
permissions:
  contents: write
concurrency:
  group: football-live-logo-20261026
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'futurecode064-cyber/AI-Recap-GitHub'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football-daily-render
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lossless PNG validator
        run: python -m pip install --quiet pillow
      - name: Mirror genuine October 26 crests locally and map both export systems
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, re, time, urllib.parse, urllib.request
          from PIL import Image
          root=pathlib.Path("football-daily")
          report=json.loads((root/"data/today.json").read_text(encoding="utf-8"))
          odds=json.loads((root/"data/odds/2026-10-26.json").read_text(encoding="utf-8"))
          assert report["reportDate"]==odds["reportDate"]=="2026-10-26"
          assert len(report["matches"])==len(odds["matches"])==11
          main=root/"main-export-logos.js"
          brand=root/"brand-export-data.js"
          main_src=main.read_text(encoding="utf-8")
          brand_src=brand.read_text(encoding="utf-8")
          def mapping(source,name):
              match=re.search(r"const "+name+r"=(\{.*?\});",source,re.S)
              assert match,name
              return json.loads(match.group(1))
          main_map=mapping(main_src,"teams")
          brand_map=mapping(brand_src,"teamFiles")
          assets=root/"assets/brand-export-teams"
          assets.mkdir(parents=True,exist_ok=True)
          urls=list(dict.fromkeys(url for match in report["matches"] for url in (match.get("homeCrestUrl"),match.get("awayCrestUrl")) if url))
          assert len(urls)==22,("Expected 22 distinct authentic 26 Oct team crests",len(urls))
          approved={"cdn.footballnation.eu","images.fotmob.com","a.espncdn.com"}
          errors=[]
          def fetch_png(url):
              host=urllib.parse.urlparse(url).hostname
              if host not in approved or not url.startswith("https://"): raise ValueError("Unapproved image source")
              exception=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36","Accept":"image/avif,image/webp,image/apng,image/png,image/*;q=0.8,*/*;q=0.5","Referer":"https://footballnation.eu/" if host=="cdn.footballnation.eu" else "https://www.fotmob.com/"})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          raw=response.read(2500000)
                      with Image.open(io.BytesIO(raw)) as original:
                          original.load()
                          if original.width<32 or original.height<32 or original.width>2400 or original.height>2400: raise ValueError("Invalid crest dimensions")
                          img=original.convert("RGBA")
                          if not img.getbbox():raise ValueError("Completely transparent crest")
                          out=io.BytesIO();img.save(out,format="PNG",optimize=True)
                          value=out.getvalue()
                          if len(value)<120 or not value.startswith(b"\x89PNG\r\n\x1a\n"):raise ValueError("Invalid PNG")
                          return value
                  except Exception as e:
                      exception=e
                      time.sleep(attempt+1)
              raise RuntimeError(str(exception))
          for index,url in enumerate(urls,1):
              filename=hashlib.sha256(url.encode("utf-8")).hexdigest()[:16]+".png"
              dest=assets/filename
              try:
                  if dest.exists():
                      with Image.open(dest) as img: img.verify()
                  else: dest.write_bytes(fetch_png(url))
                  main_map[url]="assets/brand-export-teams/"+filename
                  brand_map[url]=filename
                  print("Crest "+str(index)+"/22 OK: "+url,flush=True)
              except Exception as e: errors.append((url,str(e)))
          if errors:
              raise RuntimeError("Failed authentic crest downloads: "+json.dumps(errors,ensure_ascii=False))
          def update(path,text,key,values):
              expr=r"(const "+key+r"=)\{.*?\};"
              updated,count=re.subn(expr,lambda m:m.group(1)+json.dumps(values,ensure_ascii=False,separators=(",",":"))+";",text,count=1,flags=re.S)
              assert count==1
              path.write_text(updated,encoding="utf-8")
          update(main,main_src,"teams",main_map)
          update(brand,brand_src,"teamFiles",brand_map)
          leagues=mapping(main.read_text(encoding="utf-8"),"leagues")
          league_brand=mapping(brand.read_text(encoding="utf-8"),"local")
          for match in report["matches"]:
              for names in (leagues,league_brand):
                  key=names.get(match["league"])
                  assert key and (root/"assets/league-logos"/(key+".png")).is_file(),("Missing genuine local league logo",match["league"])
          for url in urls:
              assert main_map[url] and brand_map[url]
              assert (assets/brand_map[url]).exists()
          print(json.dumps({"date":"2026-10-26","crestCount":len(urls),"allCrestsPinned":True,"leagueLogosVerified":True,"mainAndBrandMappingsWritten":True}))
          PY
      - name: Commit verified PNG assets to actual production branch
        run: |
          git config user.name 'future-code-logo-repair[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-daily/assets/brand-export-teams football-daily/main-export-logos.js football-daily/brand-export-data.js
          if git diff --cached --quiet; then echo 'Verified crest assets are already current'; else
            git commit -m 'Fix 26 Oct team logos in all website frame PNG downloads'
            git push origin HEAD:football-daily-render
          fi
