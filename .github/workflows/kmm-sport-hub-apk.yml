name: KMM Sport Hub Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kmm-sport-hub-apk.yml'
      - '.github/workflows/ykz-soccer-tips-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate KMM Android app from YKZ image-saving implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/ykz-soccer-tips-apk.yml').read_text()
          block = src.split('      - name: Build YKZ Soccer Tips APK\n        shell: bash\n        run: |\n', 1)[1]
          block = block.split('      - uses: actions/upload-artifact@v4', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          for before, after in [
              ('YKZ Soccer Tips', 'KMM Sport Hub'),
              ('YKZ-Soccer-Tips', 'KMM-Sport-Hub'),
              ('ykz-soccer-tips', 'kmm-sport-hub'),
              ('YKZSoccerTips', 'KMMSportHub'),
              ('ykz-family', 'kmm-sport-hub'),
              ('com.futurecode.ykzsoccertips', 'com.futurecode.kmmsporthub'),
              ('ykzsoccertips', 'kmmsporthub'),
              ('ykz_logo', 'kmm_logo'), ('ykz-logo', 'kmm-logo'),
              ('ykz-apk-output', 'kmm-apk-output'),
              ('YKZ', 'KMM'), ('ykz', 'kmm'),
              ("'#D50000'", "'#D30000'"),
              ('Color.rgb(165,0,0)', 'Color.rgb(211,0,0)'),
              ('versionCode 2', 'versionCode 1'),
              ("versionName '1.1.0'", "versionName '1.0.0'")
          ]:
              script = script.replace(before, after)
          for expected in (
              'https://future-code-football-daily.pages.dev/kmm-sport-hub/',
              'com.futurecode.kmmsporthub',
              'KMMNative', 'KMMSaveBlob', 'MediaStore.Images.Media',
              'kmm-apk-output/KMM-Sport-Hub.apk',
              'kmm-sport-hub/assets/logo.webp',
              "versionName '1.0.0'"
          ):
              assert expected in script, expected
          assert 'YKZ' not in script and 'ykz' not in script
          Path('/tmp/build_kmm_sport_hub.sh').write_text(script)
          PY
      - name: Build KMM Sport Hub APK
        run: bash /tmp/build_kmm_sport_hub.sh
      - name: Verify APK identity and download bridge
        run: |
          APK=kmm-apk-output/KMM-Sport-Hub.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.futurecode.kmmsporthub'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: KMM-Sport-Hub-APK
          path: kmm-apk-output/KMM-Sport-Hub.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view kmm-sport-hub-v1.0.0 >/dev/null 2>&1; then
            gh release upload kmm-sport-hub-v1.0.0 kmm-apk-output/KMM-Sport-Hub.apk --clobber
          else
            gh release create kmm-sport-hub-v1.0.0 kmm-apk-output/KMM-Sport-Hub.apk --title 'KMM Sport Hub v1.0.0' --notes 'Android APK for the official KMM Sport Hub site; supports PNG poster/image saving into the phone Pictures folder.'
          fi
