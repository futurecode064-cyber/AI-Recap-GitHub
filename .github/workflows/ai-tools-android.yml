name: Future Code AI Tools Android Beta Build
on:
  push:
    branches: [main]
    paths: ['ai-tools-android/**','.github/workflows/ai-tools-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect installed Android SDK
        run: |
          test -d "$ANDROID_HOME"
          command -v sdkmanager
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android test APK (debug signing only)
        working-directory: ai-tools-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-AI-Tools-v1.0.0-BETA-debug
          path: ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
