name: Future Code AI Tools Android Beta Build + Site Handoff
on:
  push:
    branches: [main]
    paths: ['ai-tools-android/**','.github/workflows/ai-tools-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android test APK (debug signing only)
        working-directory: ai-tools-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package the APK and catalog for EXISTING App Downloads site
        run: python scripts/package_ai_tools_gateway.py --beta-apk ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify website package contains the beta APK and icon
        run: |
          python - <<'PY'
          import zipfile, json
          z=zipfile.ZipFile('build/future-code-ai-tools-gateway.zip')
          for path in ('ai-tools/download.html', 'ai-tools/icon.webp', 'ai-tools/downloads/future-code-ai-tools-v1.0.2-beta.apk','ai-tools/announcements.json'):
              assert path in z.namelist(), path
          print("Site package verified",len(z.read('ai-tools/downloads/future-code-ai-tools-v1.0.2-beta.apk')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-AI-Tools-v1.0.2-APP-DOWNLOADS-Website-Package
          path: build/future-code-ai-tools-gateway.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-AI-Tools-v1.0.2-BETA-debug
          path: ai-tools-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
