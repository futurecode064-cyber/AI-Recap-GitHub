name: Build Future Code Seven Updaters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-seven-app-updaters.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: kids-learning
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/a66db1e3-e3c5-4e92-b045-27271a0fd69d-FC-kids-learning-source.zip
            gradle_kind: wrapper
          - slug: daily-money
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/fd09adc3-d4c9-4f8b-9ff6-a83b528a73f3-FC-daily-money-source.zip
            gradle_kind: wrapper
          - slug: medicine-reminder
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/85aea0c9-40f3-4469-80ab-3ea76c3e7f8c-FC-medicine-reminder-source.zip
            gradle_kind: wrapper
          - slug: safety-guide
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/9bc58a8d-65cd-4a03-a539-51711f8011f2-FC-safety-guide-source.zip
            gradle_kind: wrapper
          - slug: auto-video-cutter
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/07c13d9e-d61f-4bc9-8cb1-d367e2df95d1-FC-auto-video-cutter-source.zip
            gradle_kind: gradle
          - slug: ai-astrology
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/c0952c67-9820-4c16-b9e9-48428f08c4bf-FC-ai-astrology-source.zip
            gradle_kind: gradle
          - slug: el-nino
            source_url: https://futurecodeaistudio.floot.app/_cdn/static/53b87c6d-f89a-4aeb-b5c1-e7e830207dd3-FC-el-nino-source.zip
            gradle_kind: gradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android platform 35 and 36
        shell: bash
        run: |
          set -e
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Download prepared source package
        env:
          SOURCE_URL: ${{ matrix.source_url }}
        run: |
          set -euo pipefail
          mkdir -p build-source
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$SOURCE_URL" -o /tmp/future-code-source.zip
          test -s /tmp/future-code-source.zip
          unzip -q /tmp/future-code-source.zip -d build-source
          test -f build-source/app/build.gradle -o -f build-source/app/build.gradle.kts
      - name: Assemble APK for owner signing
        shell: bash
        env:
          GRADLE_KIND: ${{ matrix.gradle_kind }}
        run: |
          set -euo pipefail
          cd build-source
          if [[ "$GRADLE_KIND" = wrapper ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleRelease
          fi
          test -s app/build/outputs/apk/release/app-release-unsigned.apk || test -s app/build/outputs/apk/release/app-release.apk
      - name: Stage APK
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          filename="$(find build-source/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -n "$filename"
          cp "$filename" "artifact/fc-${SLUG}-UNSIGNED.apk"
          sha256sum "artifact/fc-${SLUG}-UNSIGNED.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fc-${{ matrix.slug }}-unsigned
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 7
