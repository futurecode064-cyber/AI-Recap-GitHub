name: Daily Football — All Sections, Tips, Probability, News Images, Frames QA
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/daily-tips-frame-qa.yml'
      - 'football-daily/data/today.json'
      - 'football-daily/data/tips/**'
      - 'football-daily/data/news/latest.json'
      - 'football-daily/main-ai-score.js'
      - 'football-daily/main-ai-bulk-export.js'
      - 'football-daily/main-tip-scores.js'
      - 'football-daily/main-probability.js'
      - 'football-daily/index.html'
      - 'football-daily/assets/news-*/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-football-ui-integrity
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football-daily-render
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax and source-separated scores
        run: |
          node --check football-daily/main-ai-score.js
          node --check football-daily/main-ai-bulk-export.js
          node --check football-daily/main-probability.js
          node --check football-daily/main-tip-scores.js
          node --check football-daily/news-section.js
          node - <<'NODE'
          const a=require('node:assert/strict'),fs=require('node:fs');
          const root='football-daily/data/',report=JSON.parse(fs.readFileSync(root+'today.json'));
          const date=report.reportDate,prices=JSON.parse(fs.readFileSync(root+'odds/'+date+'.json'));
          const tips=JSON.parse(fs.readFileSync(root+'tips/'+date+'.json'));
          const news=JSON.parse(fs.readFileSync(root+'news/latest.json'));
          const model=require('./football-daily/main-ai-score-model.js');
          const tip=require('./football-daily/main-tip-scores.js');
          a.equal(report.published,true);a.equal(prices.reportDate,date);a.equal(tips.reportDate,date);a.equal(news.date,date);
          a.equal(prices.matches.length,report.matches.length);
          a.equal(tips.items.length,report.matches.length);
          a.equal(report.matches.filter(m=>m.specialChoice).length,2);
          a.equal(news.items.length,10);
          const byId=new Map(report.matches.map(m=>[m.fixtureId,m]));
          for(const t of tips.items){
            const m=byId.get(t.fixtureId);a(m&&t.home===m.home&&t.away===m.away);
            a((/^\d+-\d+$/.test(t.score||'')&&t.sourceUrl&&t.sourceDate&&t.sourceName)||t.unavailableReason);
          }
          for(const m of report.matches){
            a(m.dailyPreviewText?.length>180);
            a.equal(m.homeLastFive?.length,5);a.equal(m.awayLastFive?.length,5);
            a(/^\d+-\d+$/.test(tip.bookie(m)),'Bookie model blank '+m.fixtureId);
            a(/^\d+-\d+$/.test(model.predict(m)[0]),'AI model blank '+m.fixtureId);
            a(m.homeOdds&&m.drawOdds&&m.awayOdds,'1X2 missing '+m.fixtureId);
          }
          for(const s of news.items){
            a(s.image&&s.imageCredit&&s.imageLicense&&s.imageSourceUrl&&s.imageCaption,'Uncredited image '+s.id);
            if(s.image.startsWith('/assets/'))a(fs.existsSync('football-daily'+s.image),'Local news visual missing '+s.id);
          }
          a.equal(new Set(news.items.map(s=>s.image)).size,10,'Duplicate news visual');
          console.log('DAILY SOURCE, BOOKIES, AI TIPS AND 10 NEWS VISUALS: PASS',date);
          NODE
      - name: Install real browser renderer
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check live main probability, tips, news photos, three AI banner PNGs and Goal Zone
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const expected=JSON.parse(readFileSync('football-daily/data/today.json'));
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1000},acceptDownloads:true});
            await page.goto('https://future-code-football-daily.pages.dev/?fullqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(date=>document.querySelectorAll('.fc-ai-match').length>0&&document.querySelectorAll('.fc-prob-row').length>0&&document.querySelectorAll('.fc-news-card').length>0&&document.querySelector('#fcProbDate')?.textContent?.includes(date),expected.reportDate,{timeout:60000});
            const full=await page.evaluate(()=>{
              const ai=[...document.querySelectorAll('.fc-ai-match')].map(row=>[...row.querySelectorAll('.fc-ai-score')].map(x=>x.textContent.trim()));
              const prob=[...document.querySelectorAll('.fc-prob-row')].map(row=>[...row.querySelectorAll('.fc-prob-percent')].map(x=>x.textContent.trim()));
              const news=[...document.querySelectorAll('.fc-news-card img.fc-news-image')];
              return {ai,prob,newsCount:news.length,newsUrls:news.map(x=>x.src),broken:news.filter(x=>x.complete&&x.naturalWidth===0).map(x=>x.src)};
            });
            assert.equal(full.ai.length,expected.matches.length);
            assert.equal(full.prob.length,expected.matches.length);
            for(let i=0;i<full.ai.length;i++){
              assert.equal(full.ai[i].length,3);assert.match(full.ai[i][1],/^\d+-\d+$/);assert.match(full.ai[i][2],/^\d+-\d+$/);
              assert(/^\d+-\d+$/.test(full.ai[i][0])||full.ai[i][0]==='—','VIP incorrectly blank');
            }
            for(let i=0;i<full.prob.length;i++){
              const cells=full.prob[i];assert.equal(cells.length,4,'Missing percent columns');
              assert(cells.every(x=>/^\d+%$/.test(x)),'Unverified / missing percentages '+JSON.stringify(cells));
              assert.equal(parseInt(cells[0])+parseInt(cells[1]),100);
              assert.equal(parseInt(cells[2])+parseInt(cells[3]),100);
            }
            assert.equal(full.newsCount,10);
            await page.waitForFunction(()=>[...document.querySelectorAll('.fc-news-card img.fc-news-image')].length===10&&[...document.querySelectorAll('.fc-news-card img.fc-news-image')].every(x=>x.complete&&x.naturalWidth>0),null,{timeout:30000});
            const images=await page.evaluate(async()=>{
              const report=await (await fetch('/data/today.json',{cache:'no-store'})).json();
              const p=window.FutureCodeAiBulkExport;
              const output=[];
              for(const id of ['best','final','special']){
                const plan=p.planPages(report.matches.slice(0,4))[0];
                const blob=await p.renderBlob(plan,{date:report.reportDate,frame:id,predict:m=>window.FutureCodeTipScores.predict(m),
                  leagueLabel:l=>l,leagueLogo:l=>window.FutureCodeMainLogoAssets?.leagueCrest?.(l),
                  teamName:(m,side)=>m[side+'Display']||m[side],teamLogo:(m,side)=>m[side+'CrestUrl'],
                  displayTime:m=>m.sourceKickoff});
                if(blob.size<50000)throw Error('AI '+id+' empty PNG');
                const url=URL.createObjectURL(blob);
                const dims=await new Promise((ok,fail)=>{let img=new Image();img.onload=()=>ok({w:img.naturalWidth,h:img.naturalHeight});img.onerror=()=>fail(Error('Invalid PNG '+id));img.src=url;});
                URL.revokeObjectURL(url);
                if(dims.w!==1200||dims.h<500)throw Error('Bad frame geometry '+id+JSON.stringify(dims));
                output.push({id,bytes:blob.size,...dims});
              }
              const stories=(await(await fetch('/data/news/latest.json',{cache:'no-store'})).json()).items;
              const poster=await window.FutureCodeNewsFrameExport.render(stories[0]);
              if(!poster.blob||poster.blob.size<20000)throw Error('News PNG not generated');
              return {frames:output,newsPNGBytes:poster.blob.size};
            });
            console.log('MAIN 15 SOURCE-SEPARATED TIPS, 15 FOUR-CELL PERCENTAGES, 10 LOADED NEWS IMAGES: PASS');
            console.log('THREE ACTUAL BRANDED AI PNGS AND ONE LICENSED NEWS POSTER: '+JSON.stringify(images));
            const goal=await browser.newPage({viewport:{width:960,height:800}});
            await goal.goto('https://future-code-football-daily.pages.dev/future-code-journal/?newsqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await goal.waitForFunction(()=>document.querySelectorAll('.fc-news-card img.fc-news-image').length===10,null,{timeout:45000});
            await goal.waitForFunction(()=>[...document.querySelectorAll('.fc-news-card img.fc-news-image')].every(x=>x.complete&&x.naturalWidth>0),null,{timeout:30000});
            console.log('GOAL ZONE 10 NEWS IMAGES: PASS');
          }finally{await browser.close();}
          NODE
