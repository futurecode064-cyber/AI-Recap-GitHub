name: Daily Tips + Six-Section Frame Download QA
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/daily-tips-frame-qa.yml'
      - 'football-daily/main-tip-scores.js'
      - 'football-daily/main-ai-score.js'
      - 'football-daily/main-ai-bulk-export.js'
      - 'football-daily/frame-editor.html'
      - 'football-daily/frame-workspace.js'
      - 'football-daily/frame-export-engine.js'
      - 'football-daily/index.html'
      - 'football-daily/data/tips/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and dated source validation
        run: |
          node --check football-daily/main-tip-scores.js
          node --check football-daily/main-ai-score.js
          node --check football-daily/main-ai-bulk-export.js
          node --check football-daily/frame-workspace.js
          node --check football-daily/frame-export-engine.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const tips=require('./football-daily/data/tips/2026-10-28.json');
          const report=require('./football-daily/data/today.json');
          const seen=new Set;
          for(const t of tips.items){
            const fixture=report.matches.find(x=>x.fixtureId===t.fixtureId);
            assert(fixture&&fixture.home===t.home&&fixture.away===t.away);
            assert.match(t.score,/^\d+-\d+$/);assert.match(t.sourceUrl,/^https:\/\//);
            assert.match(t.sourceDate,/^\d{4}-\d{2}-\d{2}$/);assert(!seen.has(t.fixtureId));
            seen.add(t.fixtureId);
          }
          console.log('DATED VIP SOURCES PASS',tips.items.length);
          NODE
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Real browser six-section previews and source-separated scores
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const page=await browser.newPage({viewport:{width:1350,height:950},acceptDownloads:true});
            const origin='https://future-code-football-daily.pages.dev/';
            let ready=false;
            for(let i=0;i<9;i++){
              await page.goto(origin+'frame-editor.html?tip-qa='+i,{waitUntil:'domcontentloaded',timeout:45000});
              try{await page.locator('#frameList .frame-row').first().waitFor({timeout:10000});ready=true;break;}
              catch(err){if(i===8)throw err;await page.waitForTimeout(5000);}
            }
            assert(ready);
            const summary=await page.evaluate(()=>{
              const st=window.FCStudio,models=st.getHome(),m=st.getReport().matches[0];
              const details=models.FutureCodeTipScores.details(m);
              return {date:st.getDate(),scores:models.FutureCodeTipScores.predict(m),
                details,layouts:Object.fromEntries(st.TYPES.map(k=>[k,st.getSectionLayout(k)])),
                scopes:st.TYPES.length,all:st.combos().length};
            });
            assert.equal(summary.date,'2026-10-28');
            assert.equal(summary.scores[0],'2-1');
            assert.equal(summary.scopes,6);assert(summary.all>=30);
            assert(summary.details.vipInternet.sourceUrl.includes('footballpredictions.com'));
            assert.equal(summary.layouts.odds,'two');
            assert.equal(summary.layouts.previews,'one');
            await page.locator('#navDownloads').click();
            const cases=[
              ['odds','odds-bcf','one'],
              ['previews','preview-bcf','one'],
              ['specials','special-choice','one'],
              ['results','results-best','one'],
              ['ai','ai-best','one'],
              ['news','news-journal','one']
            ];
            const success=[];
            for(const [section,frame,layout] of cases){
              await page.locator('#downSection').selectOption(section);
              await page.locator('#downFrame').selectOption(frame);
              await page.locator('[data-frame-section="'+section+'"]').selectOption(layout);
              const opts=page.locator('#matchFilter option');
              if(await opts.count()>1)await page.locator('#matchFilter').selectOption(await opts.nth(1).getAttribute('value'));
              await page.locator('#downPreview').click();
              try{
                await page.waitForFunction(()=>!document.querySelector('#progressWrap')?.hidden===false,null,{timeout:100000});
              }catch(e){}
              const state=await page.locator('#status').innerText();
              if(!state.includes('PNG Preview'))throw Error(section+' preview: '+state);
              const img=await page.locator('#downPreviewImage').evaluate(n=>({visible:!n.hidden,width:n.naturalWidth,height:n.naturalHeight}));
              assert(img.visible&&img.width>300&&img.height>200,section+' PNG missing '+JSON.stringify(img));
              success.push(section);
            }
            await page.locator('#downSection').selectOption('odds');
            await page.locator('#downFrame').selectOption('odds-bcf');
            await page.locator('[data-frame-section="odds"]').selectOption('two');
            await page.locator('#matchFilter').selectOption('all');
            const dl=page.waitForEvent('download',{timeout:110000});
            await page.locator('#downZip').click();
            const download=await dl;
            assert(download.suggestedFilename().endsWith('.zip'));
            console.log('SIX SECTION FRAME PREVIEW PASS',JSON.stringify({success,zip:download.suggestedFilename(),summary}));
          }finally{await browser.close();}
          NODE
