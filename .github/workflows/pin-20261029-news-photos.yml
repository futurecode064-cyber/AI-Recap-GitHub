name: Pin Oct 29 Licensed Football News Images (All 10)
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/pin-20261029-news-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fc-football-news-photo-20261029
  cancel-in-progress: false
jobs:
  license-photo-gate:
    if: github.repository == 'futurecode064-cyber/AI-Recap-GitHub'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football-daily-render
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow required for genuine image validation
        run: python -m pip install --quiet Pillow
      - name: Pin all 10 verified reusable editorial photos
        run: python football-daily/scripts/pin_20261029_news_photos.py
      - name: Verify every image file, license and distinct news story
        run: |
          python - <<'PY'
          import json,pathlib
          from PIL import Image
          root=pathlib.Path('football-daily')
          j=json.loads((root/'data/news/latest.json').read_text())
          assert len(j['items'])==10 and all(s['image'].startswith('/assets/news-2026-10-29/') for s in j['items'])
          assert len(set(s['image'] for s in j['items']))==10
          for s in j['items']:
              assert s['imageCredit'] and s['imageLicense'] and s['imageSourceUrl'] and s['imageCaption']
              im=root/s['image'].lstrip('/')
              with Image.open(im) as photo:
                  photo.verify()
              assert im.stat().st_size>7000,im
          print('10 UNIQUE LICENSED NEWS PHOTOS: PASS')
          PY
      - name: Deploy photo + metadata together only after validation
        run: |
          git config user.name 'future-code-news-images[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add football-daily/assets/news-2026-10-29 football-daily/data/news/latest.json
          if git diff --cached --quiet; then
            echo "Images already pinned; nothing to change"
          else
            git commit -m 'Publish 10 rights-checked football news photos on same origin with image credits'
            git pull --rebase origin football-daily-render
            git push origin HEAD:football-daily-render
          fi
