name: YKZ Soccer Tips Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ykz-soccer-tips-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build YKZ Soccer Tips APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/ykz-soccer-tips && cd /tmp/ykz-soccer-tips
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'__YKZ_END_settings_gradle'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'YKZSoccerTips'
          include ':app'
          __YKZ_END_settings_gradle
          
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'__YKZ_END_build_gradle'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          __YKZ_END_build_gradle
          
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'__YKZ_END_gradle_properties'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          __YKZ_END_gradle_properties
          
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'__YKZ_END_app_build_gradle'
          plugins { id 'com.android.application' }
          android {
           namespace 'com.futurecode.ykzsoccertips'
           compileSdk 35
           defaultConfig {
            applicationId 'com.futurecode.ykzsoccertips'
            minSdk 24
            targetSdk 35
            versionCode 1
            versionName '1.0.0'
           }
           compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
           }
          }
          __YKZ_END_app_build_gradle
          
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'__YKZ_END_app_src_main_AndroidManifest_xml'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="YKZ Soccer Tips" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          __YKZ_END_app_src_main_AndroidManifest_xml
          
          mkdir -p "$(dirname 'app/src/main/java/com/futurecode/ykzsoccertips/MainActivity.java')"
          cat > 'app/src/main/java/com/futurecode/ykzsoccertips/MainActivity.java' <<'__YKZ_END_app_src_main_java_com_futurecode_ykzsoccertips_MainActivity_java'
          package com.futurecode.ykzsoccertips;
          
          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.MimeTypeMap;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.util.Locale;
          
          public class MainActivity extends Activity {
            static final String HOME="https://future-code-football-daily.pages.dev/ykz-family/";
            static final String HOST="future-code-football-daily.pages.dev";
            WebView web;
            ProgressBar progress;
            LinearLayout offline;
            ValueCallback<Uri[]> chooser;
          volatile String currentPage=HOME;
            @SuppressLint({"SetJavaScriptEnabled","AddJavascriptInterface"})
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(165,0,0));
              getWindow().setNavigationBarColor(Color.BLACK);
              FrameLayout frame=new FrameLayout(this);
              web=new WebView(this);
              frame.addView(web,new FrameLayout.LayoutParams(-1,-1));
              progress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
              progress.setMax(100);
              frame.addView(progress,new FrameLayout.LayoutParams(-1,5,Gravity.TOP));
              offline=new LinearLayout(this);
              offline.setBackgroundColor(Color.WHITE);offline.setOrientation(1);offline.setGravity(Gravity.CENTER);
              TextView info=new TextView(this);
              info.setText("YKZ Soccer Tips\n\nWebsite ချိတ်ဆက်၍ မရပါ။\nအင်တာနက်စစ်ဆေးပါ။\nလိုအပ်ပါက VPN ဖွင့်ပြီး ပြန်ကြိုးစားပါ။");
              info.setTextColor(Color.DKGRAY);info.setTextSize(20);info.setGravity(Gravity.CENTER);
              offline.addView(info);
              Button retry=new Button(this);retry.setText("ပြန်လည်ကြိုးစားရန်");
              retry.setOnClickListener(v->{offline.setVisibility(View.GONE);web.loadUrl(HOME);});offline.addView(retry);
              frame.addView(offline,new FrameLayout.LayoutParams(-1,-1));offline.setVisibility(View.GONE);
              setContentView(frame);
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);
              s.setAllowFileAccess(false);s.setAllowContentAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);s.setSupportZoom(false);
              s.setJavaScriptCanOpenWindowsAutomatically(false);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              CookieManager.getInstance().setAcceptCookie(true);
              web.addJavascriptInterface(new NativeDownload(),"YKZNative");
              web.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView w,WebResourceRequest r){
                  if(!r.isForMainFrame())return false;
                  Uri u=r.getUrl();
                  if("https".equals(u.getScheme())&&HOST.equals(u.getHost()))return false;
                  String sc=u.getScheme();
                  if(sc==null)return true;
                  if(sc.equals("http")||sc.equals("https")||sc.equals("tel")||sc.equals("mailto")||sc.equals("tg")||sc.equals("viber")){
                    try{startActivity(new Intent(Intent.ACTION_VIEW,u).addCategory(Intent.CATEGORY_BROWSABLE));}catch(Exception e){msg("Link ဖွင့်မရပါ");}
                  }return true;
                }
                @Override public void onPageStarted(WebView w,String u,android.graphics.Bitmap f){
                  currentPage=u;
                  offline.setVisibility(View.GONE);progress.setVisibility(View.VISIBLE);}
                @Override public void onPageFinished(WebView w,String u){
                  currentPage=u;
                  if(u.startsWith(HOME))installSaveHook();
                  progress.setVisibility(View.GONE);
                }
                @Override public void onReceivedError(WebView w,WebResourceRequest r,android.webkit.WebResourceError e){
                  if(r.isForMainFrame()){offline.setVisibility(View.VISIBLE);progress.setVisibility(View.GONE);}}
                @Override public void onReceivedSslError(WebView w,android.webkit.SslErrorHandler h,android.net.http.SslError e){
                  h.cancel();offline.setVisibility(View.VISIBLE);}
              });
              web.setWebChromeClient(new WebChromeClient(){
                @Override public void onProgressChanged(WebView v,int p){progress.setProgress(p);if(p>=100)progress.setVisibility(View.GONE);}
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams params){
                  if(chooser!=null)chooser.onReceiveValue(null);chooser=cb;
                  try{startActivityForResult(params.createIntent(),8);return true;}catch(Exception e){chooser=null;return false;}
                }
              });
              web.setDownloadListener((url,agent,disposition,mime,size)->{
                String name=URLUtil.guessFileName(url,disposition,mime);
                if(url.startsWith("blob:")||url.startsWith("data:")){
                  String js="if(window.YKZSaveBlob){window.YKZSaveBlob("+quote(url)+","+quote(name)+");}else{YKZNative.error();}";
                  web.evaluateJavascript(js,null);
                }else if(url.startsWith("https://")){
                  try{DownloadManager.Request req=new DownloadManager.Request(Uri.parse(url));
                    req.setTitle(name);req.setNotificationVisibility(1);
                    req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,name.replaceAll("[\\\\/:*?\"<>|]","_"));
                    String cookie=CookieManager.getInstance().getCookie(url);
                    if(cookie!=null)req.addRequestHeader("Cookie",cookie);
                    ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(req);msg("Download စတင်ပါပြီ");
                  }catch(Exception e){msg("Download မရပါ");}
                }
              });
              if(b==null)web.loadUrl(HOME);else web.restoreState(b);
            }
            static String quote(String s){return "\""+s.replace("\\","\\\\").replace("\"","\\\"").replace("\n","\\n")+"\"";}
            void installSaveHook() {
            web.evaluateJavascript("(function(){\n  if (window.__YKZSaveInstalled) return;\n  window.__YKZSaveInstalled = true;\n  const objects = new Map();\n  const oldCreate = URL.createObjectURL.bind(URL);\n  const oldRevoke = URL.revokeObjectURL.bind(URL);\n  URL.createObjectURL = function(value){\n    const url = oldCreate(value);\n    if (value instanceof Blob) objects.set(url, value);\n    return url;\n  };\n  URL.revokeObjectURL = function(url){\n    setTimeout(function(){objects.delete(url);}, 60000);\n    return oldRevoke(url);\n  };\n  function notifyError(){\n    if (window.YKZNative && window.YKZNative.error) window.YKZNative.error();\n  }\n  async function saveUrl(url,filename){\n    try {\n      let blob = objects.get(url);\n      if (!blob) {\n        const response = await fetch(url);\n        if (!response.ok) throw new Error('Unable to fetch image');\n        blob = await response.blob();\n      }\n      if (blob.size > 24000000) throw new Error('Image exceeds allowed size');\n      const reader = new FileReader();\n      reader.onload = function(){\n        if (typeof reader.result === 'string' && window.YKZNative){\n          window.YKZNative.save(reader.result, filename || 'YKZ-Soccer-Tips.png', blob.type || 'image/png');\n        }\n      };\n      reader.onerror = notifyError;\n      reader.readAsDataURL(blob);\n    } catch (err) { notifyError(); }\n  }\n  window.YKZSaveBlob = saveUrl;\n  function trySave(anchor){\n    if (!anchor || !anchor.hasAttribute('download')) return false;\n    const href = anchor.href || anchor.getAttribute('href') || '';\n    if (/^(blob:|data:)/i.test(href) ||\n      (/^https:\\/\\/future-code-football-daily\\.pages\\.dev\\//i.test(href) && /\\.(png|jpe?g|webp)(\\?|#|$)/i.test(href))) {\n      saveUrl(href, anchor.getAttribute('download') || 'YKZ-Soccer-Tips.png');\n      return true;\n    }\n    return false;\n  }\n  const oldClick = HTMLAnchorElement.prototype.click;\n  HTMLAnchorElement.prototype.click = function(){\n    if (trySave(this)) return;\n    return oldClick.apply(this,arguments);\n  };\n  document.addEventListener('click',function(event){\n    const target = event.target;\n    const anchor = target && target.closest && target.closest('a[download]');\n    if (trySave(anchor)){\n      event.preventDefault();\n      event.stopImmediatePropagation();\n    }\n  },true);\n  const oldWindowOpen = window.open;\n  window.open = function(url){\n    if (typeof url === 'string' && /^(blob:|data:)/i.test(url)) {\n      saveUrl(url,'YKZ-Soccer-Tips.png');\n      return null;\n    }\n    return oldWindowOpen.apply(this,arguments);\n  };\n})();", null);
          }
          class NativeDownload {
            @JavascriptInterface public void error(){
              runOnUiThread(()->msg("ပုံသိမ်းမရပါ။ နောက်တစ်ကြိမ် ပြန်ကြိုးစားပါ။"));
            }
            @JavascriptInterface public void save(String data,String name,String mime) {
              try {
                Uri page = Uri.parse(currentPage);
                if (!"https".equals(page.getScheme()) || !HOST.equals(page.getHost())) return;
                if (data==null || data.length()>35000000 || !data.startsWith("data:")) throw new Exception("invalid image");
                int comma=data.indexOf(',');
                if(comma<0 || comma>150 || !data.substring(0,comma).contains(";base64")) throw new Exception("invalid base64");
                String realMime=data.substring(5,data.indexOf(';')).toLowerCase(Locale.ROOT);
                if (!realMime.equals("image/png") && !realMime.equals("image/jpeg") &&
                    !realMime.equals("image/webp") && !realMime.equals("image/gif")) throw new Exception("not image");
                byte[] bytes=Base64.decode(data.substring(comma+1),Base64.DEFAULT);
                if(bytes.length==0 || bytes.length>24000000)throw new Exception("image too large");
                String ext = realMime.equals("image/jpeg")?".jpg":realMime.equals("image/webp")?".webp":realMime.equals("image/gif")?".gif":".png";
                String filename = name==null?"":name.replaceAll("[^a-zA-Z0-9._-]","_");
                if(filename.length()>90) filename=filename.substring(0,90);
                if(filename.isEmpty()||filename.equals("download"))filename="YKZ-Soccer-Tips-"+System.currentTimeMillis()+ext;
                else if(!filename.matches("(?i).*\\.(png|jpg|jpeg|webp|gif)$"))filename+=ext;
                if (Build.VERSION.SDK_INT>=29) {
                  ContentValues v=new ContentValues();
                  v.put(MediaStore.Images.Media.DISPLAY_NAME,filename);
                  v.put(MediaStore.Images.Media.MIME_TYPE,realMime);
                  v.put(MediaStore.Images.Media.RELATIVE_PATH,Environment.DIRECTORY_PICTURES+"/YKZ Soccer Tips");
                  v.put(MediaStore.Images.Media.IS_PENDING,1);
                  Uri output=getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,v);
                  if(output==null)throw new Exception("could not create image");
                  try {
                    try(OutputStream stream=getContentResolver().openOutputStream(output)){
                      if(stream==null)throw new Exception("could not open image");
                      stream.write(bytes);
                    }
                    ContentValues published=new ContentValues();
                    published.put(MediaStore.Images.Media.IS_PENDING,0);
                    getContentResolver().update(output,published,null,null);
                  }catch(Exception e){
                    getContentResolver().delete(output,null,null);
                    throw e;
                  }
                  runOnUiThread(()->msg("ပုံကို Gallery / Pictures ထဲ သိမ်းပြီးပါပြီ"));
                } else {
                  java.io.File dir=getExternalFilesDir(Environment.DIRECTORY_PICTURES);
                  if(dir==null)throw new Exception("storage unavailable");
                  if(!dir.exists()&&!dir.mkdirs())throw new Exception("create folder failed");
                  java.io.File file=new java.io.File(dir,filename);
                  try(OutputStream stream=new java.io.FileOutputStream(file)){stream.write(bytes);}
                  android.media.MediaScannerConnection.scanFile(MainActivity.this,
                    new String[]{file.getAbsolutePath()},new String[]{realMime},null);
                  runOnUiThread(()->msg("ပုံကို App Pictures Folder ထဲ သိမ်းပြီးပါပြီ"));
                }
              }catch(Exception e){runOnUiThread(()->msg("ပုံသိမ်းမရပါ။ နောက်တစ်ကြိမ် ပြန်ကြိုးစားပါ။"));}
            }
          }
          @Override protected void onActivityResult(int code,int result,Intent data){
              super.onActivityResult(code,result,data);
              if(code==8&&chooser!=null){chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));chooser=null;}
            }
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}
            void msg(String s){Toast.makeText(this,s,Toast.LENGTH_LONG).show();}
          }
          __YKZ_END_app_src_main_java_com_futurecode_ykzsoccertips_MainActivity_java
          
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p app/src/main/res/drawable-nodpi
          if curl -fsSL --retry 2 --connect-timeout 15 'https://future-code-football-daily.pages.dev/ykz-family/assets/logo.webp' -o /tmp/ykz-logo.webp; then
            convert /tmp/ykz-logo.webp -thumbnail 512x512 -background '#D50000' -gravity center -extent 512x512 app/src/main/res/drawable-nodpi/ykz_logo.png
          else
            convert -size 512x512 xc:'#D50000' -fill white -font DejaVu-Sans-Bold -pointsize 154 -gravity center -annotate +0+0 'YKZ' app/src/main/res/drawable-nodpi/ykz_logo.png
          fi
          for spec in 'mdpi 48' 'hdpi 72' 'xhdpi 96' 'xxhdpi 144' 'xxxhdpi 192'; do
            set -- $spec; mkdir -p "app/src/main/res/mipmap-$1"
            convert app/src/main/res/drawable-nodpi/ykz_logo.png -resize "${2}x${2}" "app/src/main/res/mipmap-$1/ic_launcher.png"
          done
          gradle --no-daemon :app:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/ykz-apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ykz-apk-output/YKZ-Soccer-Tips.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: YKZ-Soccer-Tips-APK
          path: ykz-apk-output/YKZ-Soccer-Tips.apk
          if-no-files-found: error
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view ykz-soccer-tips-v1.1.0 >/dev/null 2>&1; then
            gh release upload ykz-soccer-tips-v1.1.0 ykz-apk-output/YKZ-Soccer-Tips.apk --clobber
          else
            gh release create ykz-soccer-tips-v1.1.0 ykz-apk-output/YKZ-Soccer-Tips.apk --title 'YKZ Soccer Tips v1.1.0' --notes 'Image saving fix: blob/data PNG poster export to Android Gallery Pictures; website stays live.'
          fi
