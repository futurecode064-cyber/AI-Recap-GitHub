name: Goal Zone — Original Banner PNG Live QA
on:
  push:
    branches: [football-daily-render]
    paths:
      - .github/workflows/goal-zone-banner-live-qa.yml
      - football-daily/future-code-journal/goal-zone-downloads.js
      - football-daily/future-code-journal/goal-zone-download-center.js
      - football-daily/main-preview-v4.js
      - football-daily/future-code-journal/index.html
      - football-daily/future-code-journal/assets/goal-zone-preview-special-analysis.png
      - football-daily/future-code-journal/assets/goal-zone-results-v2-correct-predictions.png
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact original asset fingerprints and JS syntax
        run: |
          node --test football-daily/tests/goal-zone-v4.test.cjs football-daily/tests/goal-zone-approved-banners.test.cjs
          node --check football-daily/future-code-journal/goal-zone-downloads.js
          node --check football-daily/future-code-journal/goal-zone-download-center.js
          node --check football-daily/main-preview-v4.js
      - name: Install Chromium for real live browser export test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Compare actual downloaded PNG headers against original source images
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const url='https://future-code-football-daily.pages.dev/future-code-journal/?section=previewV4';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const context=await browser.newContext({acceptDownloads:true,viewport:{width:1250,height:850}});
            const page=await context.newPage();
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.FutureCodePreviewV4?.brandCanvas && window.FutureCodeCanvasKit?.download,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const W=1080,H=360;
              const previewPath='./assets/goal-zone-preview-special-analysis.png';
              const resultPath='./assets/goal-zone-results-v2-correct-predictions.png';
              const load=async path=>{
                const i=new Image();i.crossOrigin='anonymous';
                await new Promise((resolve,reject)=>{i.onload=resolve;i.onerror=reject;i.src=path});
                if(i.naturalWidth!==2172||i.naturalHeight!==724)throw Error('Wrong original PNG dimensions for '+path);
                return i;
              };
              const [preview,resultImg]=await Promise.all([load(previewPath),load(resultPath)]);
              const pixels=canvas=>{
                const ctx=canvas.getContext('2d');
                return ctx.getImageData(0,0,W,H).data;
              };
              const expected=img=>{
                const c=document.createElement('canvas');c.width=W;c.height=H;
                c.getContext('2d').drawImage(img,0,0,W,H);
                return pixels(c);
              };
              const identical=(actual,reference)=>{
                if(actual.length!==reference.length)return false;
                for(let i=0;i<actual.length;i++)if(actual[i]!==reference[i])return false;
                return true;
              };
              const stub=document.createElement('canvas');stub.width=W;stub.height=150;
              stub.getContext('2d').fillStyle='#101015';stub.getContext('2d').fillRect(0,0,W,150);
              const previewOut=await window.FutureCodePreviewV4.brandCanvas(stub);
              const match={fixtureId:'qa',home:'Home',away:'Away',homeDisplay:'Home',awayDisplay:'Away',league:'Friendly',leagueDisplay:'Friendly',dailyPreviewText:'Original editorial',previewV2Summary:'Original editorial.',previewV2Selection:'Away',status:'finished',finalScore:'1-2',kickoffDisplay:'12:00'};
              const resultOut=await window.FutureCodePreviewV4.render(match,{result:true});
              return {
                preview:{width:previewOut.width,height:previewOut.height,match:identical(pixels(previewOut),expected(preview))},
                results:{width:resultOut.width,height:resultOut.height,match:identical(pixels(resultOut),expected(resultImg))}
              };
            });
            assert.equal(result.preview.width,1080);assert.equal(result.preview.height,510);
            assert.equal(result.preview.match,true,'V4 header must be pixel-identical to the approved preview asset');
            assert.equal(result.results.width,1080);assert(result.results.height>360);
            assert.equal(result.results.match,true,'Results V2 header must be pixel-identical to the approved predictions asset');
            console.log('GOAL ZONE LIVE SINGLE CANVAS & RESULTS V2 PASSED',JSON.stringify(result));
            const downloadPromise=page.waitForEvent('download',{timeout:60000});
            await page.evaluate(async()=>{
              const c=document.createElement('canvas');c.width=1080;c.height=120;
              c.getContext('2d').fillStyle='#080808';c.getContext('2d').fillRect(0,0,1080,120);
              await window.FutureCodeCanvasKit.download(c,'preview-qa-original-banner.png');
            });
            const download=await downloadPromise;
            const data=await readFile(await download.path());
            assert.equal(data.toString('hex',0,8),'89504e470d0a1a0a');
            const verify=await page.evaluate(async encoded=>{
              const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
              const image=await createImageBitmap(new Blob([bytes],{type:'image/png'}));
              const img=document.createElement('canvas');img.width=image.width;img.height=image.height;
              img.getContext('2d').drawImage(image,0,0);
              const original=new Image();await new Promise((res,rej)=>{original.onload=res;original.onerror=rej;original.src='./assets/goal-zone-preview-special-analysis.png'});
              const check=document.createElement('canvas');check.width=1080;check.height=360;
              check.getContext('2d').drawImage(original,0,0,1080,360);
              const a=img.getContext('2d').getImageData(0,0,1080,360).data;
              const b=check.getContext('2d').getImageData(0,0,1080,360).data;
              let differences=0;
              for(let i=0;i<a.length;i++)if(a[i]!==b[i])differences++;
              return {width:image.width,height:image.height,differences};
            },data.toString('base64'));
            assert.deepEqual(verify,{width:1080,height:480,differences:0});
            console.log('GOAL ZONE LIVE REGULAR PREVIEW DOWNLOAD PNG PASSED',JSON.stringify(verify));
            await context.close();
          }finally{await browser.close();}
          NODE
