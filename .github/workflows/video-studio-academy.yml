name: Future Code AI Studio APK
on:
  workflow_dispatch:
  push:
    paths: ['training-app/**', 'scripts/**', 'tests/**', '.github/workflows/video-studio-academy.yml']
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bundled assets and studio workflows
        run: |
          python3 scripts/build_portal.py
          python3 tests/validate_assets.py
          node tests/studio.test.js
          node tests/access.test.js
          node tests/portal.test.js
      - name: Check owner signing configuration
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Source checks passed. Signed APK builds require the owner's release-key repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare Android tools
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore owner release key
        if: steps.signing.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/future-code-signing"
          python3 - <<'PYCODE'
          import os, pathlib, base64
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'future-code-signing'
          (p / 'release.p12').write_bytes(base64.b64decode(os.environ['RELEASE_KEYSTORE_BASE64'], validate=True))
          (p / 'password.txt').write_text(os.environ['RELEASE_KEYSTORE_PASSWORD'] + chr(10))
          for f in p.iterdir(): f.chmod(0o600)
          PYCODE
      - name: Build checked-in source and sign
        if: steps.signing.outputs.ready == 'true'
        run: |
          python3 scripts/build_apk.py --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$RUNNER_TEMP/future-code-signing/release.p12" --password-file "$RUNNER_TEMP/future-code-signing/password.txt"
      - name: Remove private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/future-code-signing"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Future-Code-AI-Studio-v8
          path: build/Future_Code_AI_Studio_v8.apk
          retention-days: 14
          if-no-files-found: error
