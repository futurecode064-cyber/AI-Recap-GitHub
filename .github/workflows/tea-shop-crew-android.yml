name: Tea Shop Morning Crew - Android QA and APK

on:
  workflow_dispatch:
  push:
    paths:
      - "games/tea-shop-crew-20261102/**"
      - ".github/workflows/tea-shop-crew-android.yml"

permissions:
  contents: read

jobs:
  godot-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Godot 4.5.1 + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
      - name: Configure Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Godot project import and script check
        working-directory: games/tea-shop-crew-20261102
        run: |
          godot --headless --path . --editor --quit 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed" import.log; then exit 1; fi
      - name: Export Android debug APK
        working-directory: games/tea-shop-crew-20261102
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/TeaShopMorningCrew-debug.apk
          test -s build/TeaShopMorningCrew-debug.apk
          sha256sum build/TeaShopMorningCrew-debug.apk > build/SHA256SUMS.txt
          ls -lh build/
      - name: Upload Android debug APK and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeaShopMorningCrew-Android-Debug
          path: games/tea-shop-crew-20261102/build/
          retention-days: 14
      - name: Upload Godot source archive
        if: always()
        shell: bash
        run: |
          cd games
          zip -qr /tmp/TeaShopMorningCrew-Source.zip tea-shop-crew-20261102 -x '*/.godot/*' '*/build/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeaShopMorningCrew-Godot-Source
          path: /tmp/TeaShopMorningCrew-Source.zip
          retention-days: 14
