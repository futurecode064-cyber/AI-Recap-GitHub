name: Preview Version 2 — Live Browser PNG ZIP Acceptance
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/preview-v2-live-qa.yml'
      - 'football-daily/tests/preview-v2-live-qa.cjs'
      - 'football-daily/index.html'
      - 'football-daily/main-preview-v2.js'
      - 'football-daily/main-preview-v2.css'
      - 'football-daily/frame-editor.html'
      - 'football-daily/frame-workspace.js'
      - 'football-daily/frame-export-engine.js'
      - 'football-daily/data/today.json'
      - 'football-daily/config/preview-v2-format.json'
      - 'football-daily/scripts/validate_preview_v2.cjs'
      - 'football-daily/tests/preview-v2-daily-contract.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce daily Preview V2 editorial and format contract
        run: |
          node football-daily/scripts/validate_preview_v2.cjs football-daily/data/today.json
          node --test football-daily/tests/preview-v2-daily-contract.test.cjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Verify real Cloudflare Version 2 UI and PNG/ZIP
        run: node football-daily/tests/preview-v2-live-qa.cjs
      - name: Upload visual acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-v2-live-screenshot
          path: preview-v2-live.png
          if-no-files-found: ignore
