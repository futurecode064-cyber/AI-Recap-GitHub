name: Future Code Chinese - Signed Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chinese-learning/**'
      - '.github/workflows/chinese-learning-apk.yml'
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Read app version
        run: |
          set -euo pipefail
          VER="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" chinese-learning/app/build.gradle | head -n1)"
          test -n "$VER"
          echo "APK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "APK_FILE=Future_Code_Chinese_v$VER.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=chinese-learning-v$VER" >> "$GITHUB_ENV"
      - name: Assemble APK
        working-directory: chinese-learning
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug
      - name: Sign with existing private Future Code signing service
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-chinese-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-chinese-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-chinese-sign.json

          if [[ "$(jq -r '.ready' /tmp/fc-chinese-sign.json)" != "true" ]]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12 -keystore /tmp/fc-chinese-init.p12 -storepass "$PASS" -keypass "$PASS" -alias future-code-chinese -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Future Code Chinese, O=Future Code, C=MM' -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/fc-chinese-init.p12)" '{action:"initialize",store_password:$pass,keystore_b64:$b64}' > /tmp/fc-chinese-init.json
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/fc-chinese-init.json "$API" -o /tmp/fc-chinese-result.json
            jq -e '.ok == true' /tmp/fc-chinese-result.json >/dev/null
            curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-chinese-sign.json
          fi
          jq -e '.ready == true' /tmp/fc-chinese-sign.json >/dev/null
          jq -er '.keystore_b64' /tmp/fc-chinese-sign.json | base64 -d > /tmp/fc-chinese-key.p12
          ANDROID_KEYSTORE_PASS="$(jq -er '.store_password' /tmp/fc-chinese-sign.json)"
          echo "::add-mask::$ANDROID_KEYSTORE_PASS"
          export ANDROID_KEYSTORE_PASS
          mkdir -p out
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/fc-chinese-key.p12 --ks-key-alias future-code-chinese --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS --out out/$APK_FILE chinese-learning/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/$APK_FILE
          sha256sum out/*.apk
          shred -u /tmp/fc-chinese-sign.json /tmp/fc-chinese-key.p12 /tmp/fc-chinese-init.p12 /tmp/fc-chinese-init.json /tmp/fc-chinese-result.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-Chinese-signed
          path: out/*.apk
          if-no-files-found: error
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          APK=out/$APK_FILE
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fx "$APK_FILE"; then gh release upload "$TAG" "$APK"; fi
          else
            gh release create "$TAG" "$APK" --title "Future Code Chinese $APK_VERSION" --notes "Myanmar-first Mandarin learning: six stages, vocabulary, grammar, pronunciation and writing practice. Requires Android 8+, offline reading and quiz. Chinese TTS/recognition depend on device service."
          fi
