name: Built-in Frame Editor — Live Browser QA
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/built-in-frame-edit-qa.yml'
      - 'football-daily/index.html'
      - 'football-daily/main-built-in-frame-editor.js'
      - 'football-daily/brand-preview-studio.js'
      - 'football-daily/main-results-frame-studio.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: football-daily-render
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check editor scripts
        run: |
          node --check football-daily/main-built-in-frame-editor.js
          node --check football-daily/brand-preview-studio.js
          node --check football-daily/main-results-frame-studio.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Edit, hide, restore and persist original frames on live site
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const assert=(condition,message)=>{if(!condition)throw Error(message);};
          const origin='https://future-code-football-daily.pages.dev';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const context=await browser.newContext({viewport:{width:1300,height:1100}});
            const page=await context.newPage();
            let loaded=false;
            for(let attempt=0;attempt<12;attempt++){
              await page.goto(origin+'/?builtin-frame-qa='+attempt,{waitUntil:'domcontentloaded',timeout:40000});
              try{
                await page.locator('#brandPreviewStudio + .fc-built-in-frame-editor').waitFor({timeout:6500});
                await page.locator('#mainResultsFrameStudio + .fc-built-in-frame-editor').waitFor({timeout:20000});
                loaded=true;break;
              }catch(error){if(attempt===11)throw error;await page.waitForTimeout(5000);}
            }
            assert(loaded,'Built-in frame managers did not load on the live home page');
            const preview=page.locator('#brandPreviewStudio + .fc-built-in-frame-editor');
            const nativePreview=page.locator('#brandFrame');
            await preview.locator('.fc-bif-select').selectOption('bcf');
            await preview.locator('.fc-bif-name').fill('QA PREVIEW BUILTIN');
            await preview.locator('.fc-bif-color').fill('#aa2244');
            await preview.locator('.fc-bif-save').click();
            await page.waitForFunction(()=>document.querySelector('#brandFrame option')?.textContent==='QA PREVIEW BUILTIN');
            assert(await page.evaluate(()=>localStorage.getItem('future-code-built-in-frames-v1')?.includes('QA PREVIEW BUILTIN')),'Preview frame edit did not persist');
            await preview.locator('.fc-bif-hide').click();
            await page.waitForFunction(()=>![...document.querySelector('#brandFrame').options].some(o=>o.textContent==='QA PREVIEW BUILTIN'));
            await page.reload({waitUntil:'domcontentloaded',timeout:40000});
            await page.locator('#brandPreviewStudio + .fc-built-in-frame-editor').waitFor({timeout:30000});
            const previewAgain=page.locator('#brandPreviewStudio + .fc-built-in-frame-editor');
            assert(await page.evaluate(()=>![...document.querySelector('#brandFrame').options].some(o=>o.textContent==='QA PREVIEW BUILTIN')),'Hidden preview frame returned after refresh');
            await previewAgain.locator('.fc-bif-select').selectOption('bcf');
            await previewAgain.locator('.fc-bif-restore').click();
            await page.waitForFunction(()=>[...document.querySelector('#brandFrame').options].some(o=>o.textContent==='QA PREVIEW BUILTIN'));
            await previewAgain.locator('.fc-bif-reset').click();
            await page.waitForFunction(()=>document.querySelector('#brandFrame option')?.textContent==='BCF ခန့်မှန်း');

            const results=page.locator('#mainResultsFrameStudio + .fc-built-in-frame-editor');
            await results.locator('.fc-bif-select').selectOption('best');
            await results.locator('.fc-bif-name').fill('QA RESULT BUILTIN');
            await results.locator('.fc-bif-color').fill('#2255aa');
            await results.locator('.fc-bif-save').click();
            await page.waitForFunction(()=>document.querySelector('#rfsFrame option[value="best"]')?.textContent==='QA RESULT BUILTIN');
            await results.locator('.fc-bif-hide').click();
            await page.waitForFunction(()=>!document.querySelector('#rfsFrame option[value="best"]'));
            await results.locator('.fc-bif-select').selectOption('best');
            await results.locator('.fc-bif-restore').click();
            await page.waitForFunction(()=>document.querySelector('#rfsFrame option[value="best"]')?.textContent==='QA RESULT BUILTIN');
            await results.locator('.fc-bif-reset').click();
            await page.waitForFunction(()=>document.querySelector('#rfsFrame option[value="best"]')?.textContent==='BEST YOUR CHOICE');
            assert(await nativePreview.count()===1,'Preview frame selector missing');
            console.log('LIVE BUILT-IN FRAME QA PASS: preview and results names/colors edit, removal, restore, reset and persistence');
            await context.close();
          }finally{await browser.close();}
          NODE
