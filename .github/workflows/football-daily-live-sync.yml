name: Future Code Football Live Scores and H2H

# Scheduled workflows must exist on GitHub's default branch (main).
# DISABLED automatic every-15-minute score polling by owner request (2026-10-12).
# Legacy manual-only emergency tool. Publish approved edits to standalone repo main instead.
# The site and data remain on football-daily-render.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: future-code-football-live-data
  cancel-in-progress: false

jobs:
  live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: football-daily-render
          fetch-depth: 1
          persist-credentials: true

      - name: Update verified scores and historical records
        run: |
          set -euo pipefail
          python3 -m py_compile football-daily/scripts/sync_scores.py
          python3 football-daily/scripts/sync_scores.py

      - name: Commit changes without altering editorial text
        run: |
          set -euo pipefail
          git add football-daily/data/today.json football-daily/data/archive/
          if git diff --cached --quiet; then
            echo 'No fresh verified scores or H2H records to publish.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'data(football): refresh verified live scores and historical form'
          git push origin HEAD:football-daily-render
