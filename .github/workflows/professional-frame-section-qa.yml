name: Professional frame section regression
on:
  push:
    branches: [football-daily-render]
    paths: ['.github/workflows/professional-frame-section-qa.yml', 'football-daily/main-professional-frame-studio.js']
permissions:
  contents: read
jobs:
  section-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Check add, section isolation, edit, refresh and PNG
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            await page.goto('https://future-code-football-daily.pages.dev/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#fcpName').waitFor({timeout:30000});
            await page.locator('#fcpName').fill('SECTION QA FRAME');
            await page.locator('#fcpPlacement input[value=previews]').check();
            await page.locator('#fcpAdd').click({timeout:15000});
            await page.waitForFunction(()=>document.querySelector('#fcpStatus')?.textContent.includes('Download'),null,{timeout:15000});
            console.log('ADD STATUS',await page.locator('#fcpStatus').innerText());
            assert((await page.locator('#fcpStatus').innerText()).includes('Download'),'Add did not succeed');
            assert.equal(await page.locator('#brandFrame option').filter({hasText:'SECTION QA FRAME'}).count(),1);
            assert.equal(await page.locator('#fcSpecialCustomFrame option').filter({hasText:'SECTION QA FRAME'}).count(),0);
            await page.locator('#fcpName').fill('SECTION QA EDITED');
            await page.locator('#fcpSave').click();
            await page.waitForFunction(()=>document.querySelector('#fcpStatus')?.textContent.includes('သိမ်းပြီး'),null,{timeout:10000});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.locator('#fcpFrame').waitFor({timeout:30000});
            await page.waitForFunction(()=>[...document.querySelectorAll('#brandFrame option')].some(x=>x.textContent.includes('SECTION QA EDITED')),null,{timeout:15000});
            assert.equal(await page.locator('#brandFrame option').filter({hasText:'SECTION QA EDITED'}).count(),1);
            assert.equal(await page.locator('#fcSpecialCustomFrame option').filter({hasText:'SECTION QA EDITED'}).count(),0);
            const result=await page.evaluate(async()=>{
              const f=(await window.FutureCodeProfessionalFrames.list('previews')).find(x=>x.name==='SECTION QA EDITED');
              const canvas=document.createElement('canvas');canvas.width=500;canvas.height=300;
              canvas.getContext('2d').fillRect(0,0,500,300);
              const out=await window.FutureCodeProfessionalFrames.wrap(canvas,'previews','pro:'+f.id);
              return {height:out.height,png:out.toDataURL('image/png').startsWith('data:image/png')};
            });
            assert(result.height>300&&result.png);
            console.log('PROFESSIONAL SECTION QA PASS',JSON.stringify(result));
          } finally { await browser.close(); }
          NODE
