name: Future Code English Academy Android
on:
  push:
    branches: [main]
    paths:
      - 'english-academy-android/**'
      - '.github/workflows/english-academy-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          xml=Path('english-academy-android/android/AndroidManifest.xml').read_text()
          code=re.search(r'android:versionCode="(\d+)"',xml).group(1)
          version=re.search(r'android:versionName="([^"]+)"',xml).group(1)
          print(f'APK_VERSION={version}')
          print(f'APK_VERSION_CODE={code}')
          print(f'APK_FILE=Future_Code_English_Academy_v{version}.apk')
          print(f'RELEASE_TAG=english-academy-v{version}')
          PY
      - name: Prepare bundled offline English speech
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python3 scripts/generate_offline_audio.py english english-academy-android/android/assets/audio
      - name: Build offline English Academy
        working-directory: english-academy-android/android
        run: python3 build.py
      - name: Verify all offline English audio is embedded
        run: python3 scripts/verify_offline_audio_apk.py "english-academy-android/android/build/Future_Code_English_Academy_v${{ env.APK_VERSION }}_unsigned.apk" 250
      - name: Sign with existing owner release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-english-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-english-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/fc-english-sign.json
          jq -e '.ready == true' /tmp/fc-english-sign.json >/dev/null
          jq -er '.keystore_b64' /tmp/fc-english-sign.json | base64 -d > /tmp/fc-english-key.jks
          ANDROID_KEYSTORE_PASS="$(jq -er '.store_password' /tmp/fc-english-sign.json)"
          SIGN_ALIAS="$(jq -er '.key_alias' /tmp/fc-english-sign.json)"
          echo "::add-mask::$ANDROID_KEYSTORE_PASS"
          export ANDROID_KEYSTORE_PASS
          mkdir -p out
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/fc-english-key.jks --ks-key-alias "$SIGN_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS --out "out/$APK_FILE" "english-academy-android/android/build/Future_Code_English_Academy_v${APK_VERSION}_unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "out/$APK_FILE"
          sha256sum "out/$APK_FILE" > out/SHA256SUMS.txt
          shred -u /tmp/fc-english-sign.json /tmp/fc-english-key.jks 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Future-Code-English-Academy-v${{ env.APK_VERSION }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace a signed release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "out/$APK_FILE" out/SHA256SUMS.txt --title "Future Code English Academy $APK_VERSION" --notes "54 bilingual lessons across A0–C1, applied capstone practice, offline study, speech and writing practice, quizzes, local progress and reminders. Android 8+."
