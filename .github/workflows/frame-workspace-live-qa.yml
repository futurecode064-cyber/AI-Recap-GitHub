name: Unified Frame Workspace — Browser / PNG / ZIP Acceptance
on:
  push:
    branches: [football-daily-render]
    paths:
      - '.github/workflows/frame-workspace-live-qa.yml'
      - 'football-daily/frame-editor.html'
      - 'football-daily/frame-workspace.js'
      - 'football-daily/frame-export-engine.js'
      - 'football-daily/main-professional-frame-studio.js'
      - 'football-daily/main-frame-editor.js'
      - 'football-daily/news-section.js'
      - 'football-daily/index.html'
      - 'football-daily/odds.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check workspace JavaScript syntax
        run: |
          node --check football-daily/frame-workspace.js
          node --check football-daily/frame-export-engine.js
          node --check football-daily/main-professional-frame-studio.js
          node --check football-daily/main-frame-editor.js
          node --check football-daily/news-section.js
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Validate single editor, real preview and ZIP
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const origin='https://future-code-football-daily.pages.dev/';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const context=await browser.newContext({viewport:{width:1440,height:1040},acceptDownloads:true});
            const page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            for(let attempt=0;attempt<8;attempt++){
              await page.goto(origin+'frame-editor.html?acceptance='+attempt,{waitUntil:'domcontentloaded',timeout:45000});
              try{await page.locator('#frameList .frame-row').first().waitFor({timeout:12000});break;}
              catch(e){if(attempt===7)throw e;await page.waitForTimeout(5500);}
            }
            const initial=await page.evaluate(()=>({count:window.FCStudio.getState().frames.length,scopes:window.FCStudio.TYPES.length,versions:[
              !!window.FCStudio.getHome().FutureCodeFramePreview,
              !!window.FCStudio.getOdds().FutureCodeTableOddsFrames
            ]}));
            assert(initial.count>=30&&initial.scopes===7&&initial.versions.every(Boolean),JSON.stringify(initial));
            assert(await page.locator('#downSection option[value="oddsCards"]').count()===1,'Missing new Burmese odds cards download section');
            assert(await page.locator('#librarySection option[value="oddsCards"]').count()===1,'Missing new card section library filter');
            await page.locator('#librarySection').selectOption('odds');
            await page.locator('#frameList .frame-row').filter({hasText:'BCF · ပေါက်ကြေး'}).first().click();
            assert(await page.locator('#scopeChecks input[value=odds]').isChecked(),'BCF default odds scope missing');
            assert(await page.locator('#scopeChecks input[value=oddsCards]').isChecked(),'BCF must also be available as branded Burmese cards');
            await page.locator('#frameDownloadName').fill('BCF-မြန်မာကြေး');
            await page.locator('#scopeChecks input[value=previews]').check();
            await page.locator('#saveFrame').click();
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('သိမ်းပြီး'),null,{timeout:55000});
            let combination=await page.evaluate(()=>window.FCStudio.getState().placements);
            assert(combination.previews.includes('odds-bcf')&&combination.odds.includes('odds-bcf')&&combination.oddsCards.includes('odds-bcf'),'Cross-section BCF assignment failed');
            await page.locator('#navDownloads').click();
            const card=page.locator('details[data-section="oddsCards"]');
            if(!(await card.evaluate(el=>el.open)))await card.locator('summary').click();
            // Download Center uses visible per-section Multi-Selection, not the hidden legacy filters.
            await card.locator('.multi-group').nth(0).locator('[data-action="none"]').click();
            await card.locator('.multi-group').nth(0).locator('.multi-option').filter({hasText:'BCF · ပေါက်ကြေး'}).locator('input').check();
            await card.locator('.multi-group').nth(2).locator('[data-action="none"]').click();
            await card.locator('.multi-group').nth(2).locator('.multi-option').first().locator('input').check();
            await page.locator('#downPreview').click();
            await page.locator('#downPreviewImage').waitFor({timeout:100000,state:'visible'});
            const png=await page.locator('#downloadLink').getAttribute('download');
            assert(png==='BCF-မြန်မာကြေး.png','PNG name must match the Frame Editor download-name setting, received '+png);
            const previewMetrics=await page.locator('#downPreviewImage').evaluate(img=>({width:img.naturalWidth,height:img.naturalHeight,cssMaxHeight:getComputedStyle(img).maxHeight}));
            assert(previewMetrics.width>=1200&&previewMetrics.height>250&&previewMetrics.cssMaxHeight==='none','Banner / full-width scroll preview was downsized: '+JSON.stringify(previewMetrics));
            const dl=page.waitForEvent('download',{timeout:100000});
            await page.locator('#downZip').click();
            const download=await dl;
            assert(download.suggestedFilename().endsWith('.zip'),'ZIP download missing');
            const data=await readFile(await download.path());
            const entries=[];let offset=0;
            while(offset+30<=data.length&&data.readUInt32LE(offset)===0x04034b50){
              const length=data.readUInt16LE(offset+26),extra=data.readUInt16LE(offset+28),size=data.readUInt32LE(offset+18);
              entries.push(data.subarray(offset+30,offset+30+length).toString('utf8'));
              offset+=30+length+extra+size;
            }
            assert(entries.length>0&&entries.every(n=>n.startsWith('မြန်မာကြေးကတ်ပုံစံ/')),'ZIP must group PNGs by section: '+JSON.stringify(entries));
            assert(entries.includes('မြန်မာကြေးကတ်ပုံစံ/BCF-မြန်မာကြေး.png'),'ZIP must preserve the user-defined Myanmar PNG filename: '+JSON.stringify(entries));
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('အဆင်သင့်') && document.querySelector('#downloadLink')?.download.endsWith('.zip'),null,{timeout:30000});
            // Regression: upload 2400px artwork, auto-anchor both ribbons, retain PNG source and verify real exported pixels.
            await page.locator('#navLibrary').click();
            await page.locator('#addFrame').click();
            await page.locator('#frameName').fill('HighRes QA Frame');
            await page.locator('#frameDownloadName').fill('HighRes QA');
            await page.locator('#scopeChecks input[value="oddsCards"]').check();
            const artwork=await page.evaluate(()=>{
              const encode=(h,color)=>{const c=document.createElement('canvas');c.width=2400;c.height=h;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,2400,h);return c.toDataURL('image/png').split(',')[1];};
              return {top:encode(400,'#ff0000'),bottom:encode(200,'#0000ff')};
            });
            await page.locator('#frameTopFile').setInputFiles({name:'top-hires.png',mimeType:'image/png',buffer:Buffer.from(artwork.top,'base64')});
            await page.locator('#frameBottomFile').setInputFiles({name:'bottom-hires.png',mimeType:'image/png',buffer:Buffer.from(artwork.bottom,'base64')});
            await page.waitForFunction(()=>document.querySelector('#frameTop').value==='200'&&document.querySelector('#frameBottom').value==='100');
            await page.locator('#frameColor').fill('#12a4e5');
            await page.locator('#previewImage').waitFor({state:'visible',timeout:30000});
            await page.locator('#saveFrame').click();
            await page.waitForFunction(()=>window.FCStudio?.getState()?.frames?.some(f=>f.name==='HighRes QA Frame'),null,{timeout:60000});
            const uploaded=await page.evaluate(()=>{
              const f=window.FCStudio.getState().frames.find(f=>f.name==='HighRes QA Frame');
              return {id:f.id,color:f.color,top:f.top,bottom:f.bottom,
               topFormat:f.topImage?.slice(0,22),bottomFormat:f.bottomImage?.slice(0,22),
               topImage:f.topImage,bottomImage:f.bottomImage};
            });
            assert.equal(uploaded.topFormat,'data:image/png;base64,');
            assert.equal(uploaded.bottomFormat,'data:image/png;base64,');
            assert.equal(uploaded.top,200);assert.equal(uploaded.bottom,100);
            assert.equal(uploaded.color,'#12a4e5');
            assert.equal(uploaded.topImage, 'data:image/png;base64,'+artwork.top,'Top image was recompressed or resized');
            assert.equal(uploaded.bottomImage, 'data:image/png;base64,'+artwork.bottom,'Bottom image was recompressed or resized');
            await page.locator('#navDownloads').click();
            const hiCard=page.locator('details[data-section="oddsCards"]');
            if(!(await hiCard.evaluate(el=>el.open)))await hiCard.locator('summary').click();
            await hiCard.locator('.multi-group').nth(0).locator('[data-action="none"]').click();
            await hiCard.locator('.multi-group').nth(0).locator('.multi-option').filter({hasText:'HighRes QA Frame'}).locator('input').check();
            await page.locator('#downPreview').click();
            await page.locator('#downPreviewImage').waitFor({state:'visible',timeout:100000});
            const edges=await page.locator('#downPreviewImage').evaluate(img=>{
              const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
              const x=c.getContext('2d');x.drawImage(img,0,0);
              const px=(y)=>Array.from(x.getImageData(Math.floor(c.width/2),y,1,1).data);
              return {width:c.width,top:px(10),bottom:px(c.height-10)};
            });
            assert(edges.width>=1200&&edges.top[0]>230&&edges.top[1]<25&&edges.top[2]<25,'Top banner not flush/red: '+JSON.stringify(edges));
            assert(edges.bottom[2]>230&&edges.bottom[0]<25&&edges.bottom[1]<25,'Bottom banner not flush/blue: '+JSON.stringify(edges));
            console.log('HIGH-RES BANNER LIVE QA PASS',JSON.stringify({width:edges.width,top:edges.top,bottom:edges.bottom,color:uploaded.color,originalBinary:true}));
            const page2=await context.newPage();
            await page2.goto(origin,{waitUntil:'domcontentloaded'});
            const link=await page2.locator('a[href="./frame-editor.html"]').count();
            assert(link>=1,'Frame Editor link missing on main site');
            console.log('UNIFIED FRAME WORKSPACE PASS',JSON.stringify({count:initial.count,scopeCount:initial.scopes,png,zip:download.suggestedFilename(),crossSectionBCF:true,mainNav:true,sectionFolder:true,filenameFromEditor:true,brandedOddsCards:true,errors}));
            await context.close();
          }finally{await browser.close();}
          NODE
