name: Mandalay City Helper Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mandalay-apk/app/**'
      - 'mandalay-apk/settings.gradle'
      - 'mandalay-apk/build.gradle'
      - 'mandalay-apk/gradle.properties'
      - '.github/workflows/mandalay-city-helper-apk.yml'
permissions:
  contents: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Determine APK version
        run: |
          APK_VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" mandalay-apk/app/build.gradle | head -n1)"
          test -n "$APK_VERSION"
          echo "APK_VERSION=$APK_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=mandalay-city-helper-v$APK_VERSION" >> "$GITHUB_ENV"
          echo "APK_FILE=Future_Code_Mandalay_City_Helper_v$APK_VERSION.apk" >> "$GITHUB_ENV"
      - name: Download official icon
        run: |
          mkdir -p mandalay-apk/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 "https://futurecodeaistudio.floot.app/_cdn/static/ba053a15-fd86-4201-8055-15e79d52bb55-future-code-mandalay-icon.png" -o mandalay-apk/app/src/main/res/drawable-nodpi/ic_launcher.png
          file mandalay-apk/app/src/main/res/drawable-nodpi/ic_launcher.png
          test "$(stat -c%s mandalay-apk/app/src/main/res/drawable-nodpi/ic_launcher.png)" -gt 5000
      - name: Compile release and debug APK
        working-directory: mandalay-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease
      - name: Restore or create persistent private Android signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/mandalay-signing"
          OIDC="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-mandalay-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/mandalay-signing.json
          if [[ "$(jq -r '.ready' /tmp/mandalay-signing.json)" != "true" ]]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12 -keystore /tmp/mandalay-key.p12 -storepass "$PASS" -keypass "$PASS" -alias future-code-mandalay -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Future Code Mandalay City Helper, O=Future Code, C=MM' -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/mandalay-key.p12)" '{action:"initialize",store_password:$pass,keystore_b64:$b64,key_alias:"future-code-mandalay"}' > /tmp/mandalay-init.json
            curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @/tmp/mandalay-init.json "$API" -o /tmp/mandalay-init-result.json
            jq -e '.ok == true' /tmp/mandalay-init-result.json > /dev/null
            curl --fail --silent --show-error -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data '{"action":"get"}' "$API" -o /tmp/mandalay-signing.json
          fi
          jq -e '.ready == true' /tmp/mandalay-signing.json > /dev/null
          jq -r '.keystore_b64' /tmp/mandalay-signing.json | base64 -d > /tmp/mandalay-release.p12
          ANDROID_KEYSTORE_PASS="$(jq -er '.store_password' /tmp/mandalay-signing.json)"
          echo "::add-mask::$ANDROID_KEYSTORE_PASS"
          export ANDROID_KEYSTORE_PASS
          mkdir -p out
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/mandalay-release.p12 --ks-key-alias future-code-mandalay --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS --out out/$APK_FILE mandalay-apk/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/$APK_FILE
          sha256sum out/*.apk
          shred -u /tmp/mandalay-init.json /tmp/mandalay-init-result.json /tmp/mandalay-signing.json /tmp/mandalay-release.p12 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Mandalay-City-Helper-Android-APK
          path: out/*.apk
          if-no-files-found: error
      - name: Publish versioned APK without resetting release download counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' | grep -Fx "$APK_FILE"; then
              echo "APK version $APK_VERSION already published; preserving public asset and download statistics."
            else
              gh release upload "$RELEASE_TAG" "out/$APK_FILE"
            fi
          else
            gh release create "$RELEASE_TAG" "out/$APK_FILE" --title "မြို့လေး ကူညီရေး စွန့်စားခန်း Android v$APK_VERSION" --notes "Android online live game. Persistent Android signing, website hot-updates, owner notifications and checked binary-upgrade prompts. APK installs require explicit Android user approval."
          fi
