name: BW Sport Journal Android APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/bw-sport-journal-apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate BW Sport application from tested YKZ Android implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/ykz-soccer-tips-apk.yml').read_text()
          block=src.split('      - name: Build YKZ Soccer Tips APK\n        shell: bash\n        run: |\n',1)[1]
          block=block.split('      - uses: actions/upload-artifact@v4',1)[0]
          script='\n'.join(l[10:] if l.startswith('          ') else l for l in block.splitlines())+'\n'
          for a,b in [
              ('YKZ Soccer Tips','BW Sport ဘောလုံးဂျာနယ်'),
              ('YKZ-Soccer-Tips','BW-Sport-Journal'),
              ('ykz-soccer-tips','bw-sport-journal'),
              ('YKZSoccerTips','BWSportJournal'),
              ('YKZ-Tips','BW-Sport'),
              ('ykz-family','bw-sport'),
              ('com.futurecode.ykzsoccertips','com.futurecode.bwsportjournal'),
              ('ykzsoccertips','bwsportjournal'),
              ('ykz_logo','bw_logo'),('ykz-logo','bw-logo'),
              ('ykz-apk-output','bw-apk-output'),
              ('YKZ','BW'),('ykz','bw'),
              ("'#D50000'","'#0B67EC'"),
              ('Color.rgb(165,0,0)','Color.rgb(11,103,236)'),
              ('versionCode 2','versionCode 1'),
              ("versionName '1.1.0'","versionName '1.0.0'")
          ]: script=script.replace(a,b)
          Path('/tmp/build_bw_sport.sh').write_text(script)
          PY
      - name: Build APK
        run: bash /tmp/build_bw_sport.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BW-Sport-Journal-APK
          path: bw-apk-output/BW-Sport-Journal.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BW-Sport-App-Icon
          path: /tmp/bw-sport-journal/app/src/main/res/drawable-nodpi/bw_logo.png
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view bw-sport-journal-v1.0.0 >/dev/null 2>&1; then
            gh release upload bw-sport-journal-v1.0.0 bw-apk-output/BW-Sport-Journal.apk --clobber
          else
            gh release create bw-sport-journal-v1.0.0 bw-apk-output/BW-Sport-Journal.apk --title 'BW Sport ဘောလုံးဂျာနယ် v1.0.0' --notes 'Android WebView APK with image/poster save support and BW Sport live website updates.'
          fi
