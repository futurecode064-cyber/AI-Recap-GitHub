name: AI Tools Source Schema (Read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ai_tools_inspect_source.py'
      - '.github/workflows/ai-tools-source-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - run: python scripts/ai_tools_inspect_source.py
