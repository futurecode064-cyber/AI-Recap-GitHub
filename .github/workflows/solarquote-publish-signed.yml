name: SolarQuote - Signed APK and Update Channel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'solarquote/source.zip'
      - '.github/workflows/solarquote-publish-signed.yml'
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build-tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack standalone SolarQuote project
        run: |
          mkdir -p solarquote/project solarquote/signing
          unzip -q solarquote/source.zip -d solarquote/project
          test -f solarquote/project/settings.gradle.kts
      - name: Restore or securely initialize permanent signing key (GitHub OIDC + Supabase)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API="https://mxwervqihaqlxybghdak.supabase.co/functions/v1/fc-solarquote-signing"
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=future-code-solarquote-signing-v1" | jq -er '.value')"
          echo "::add-mask::$OIDC"
          curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json"             --data '{"action":"get"}' "$API" -o /tmp/solarquote-key-info.json
          if [ "$(jq -r '.ready' /tmp/solarquote-key-info.json)" != "true" ]; then
            PASS="$(openssl rand -hex 32)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -storetype PKCS12               -keystore /tmp/solarquote-create.p12               -storepass "$PASS" -keypass "$PASS" -alias solarquote               -keyalg RSA -keysize 3072 -validity 10000               -dname "CN=Future Code SolarQuote, O=Future Code AI Studio, C=MM" -noprompt
            jq -nc --arg pass "$PASS" --arg b64 "$(base64 -w0 /tmp/solarquote-create.p12)"               '{action:"initialize",store_password:$pass,keystore_b64:$b64}' > /tmp/solarquote-init.json
            curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json"               --data-binary @/tmp/solarquote-init.json "$API" -o /tmp/solarquote-init-result.json
            jq -e '.ok == true' /tmp/solarquote-init-result.json >/dev/null
            curl -fsS --retry 3 -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json"               --data '{"action":"get"}' "$API" -o /tmp/solarquote-key-info.json
          fi
          jq -e '.ready == true and .key_alias == "solarquote"' /tmp/solarquote-key-info.json >/dev/null
          jq -er '.keystore_b64' /tmp/solarquote-key-info.json | base64 --decode > solarquote/signing/release.jks
          test -s solarquote/signing/release.jks
          PASS="$(jq -er '.store_password' /tmp/solarquote-key-info.json)"
          echo "::add-mask::$PASS"
          echo "SOLARQUOTE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "SOLARQUOTE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          rm -f /tmp/solarquote-key-info.json /tmp/solarquote-init.json             /tmp/solarquote-init-result.json /tmp/solarquote-create.p12
      - name: Build unsigned release APK
        working-directory: solarquote/project
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Align, sign, verify and hash
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=solarquote/project/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGN=solarquote/signing/app-aligned.apk
          SIGNED=solarquote/signing/app-signed.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$UNSIGNED"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGN"
          "$TOOLS/apksigner" sign --ks solarquote/signing/release.jks --ks-key-alias solarquote \
            --ks-pass env:SOLARQUOTE_STORE_PASSWORD --key-pass env:SOLARQUOTE_KEY_PASSWORD \
            --out "$SIGNED" "$ALIGN"
          "$TOOLS/apksigner" verify --verbose "$SIGNED"
          "$TOOLS/aapt" dump badging "$SIGNED" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' 
          mkdir -p solarquote/releases
          python3 - <<'PY'
          import datetime,hashlib,json,pathlib,re,shutil
          grade=pathlib.Path('solarquote/project/app/build.gradle.kts').read_text()
          code=int(re.search(r'versionCode\s*=\s*(\d+)',grade).group(1))
          version=re.search(r'versionName\s*=\s*"([^"]+)"',grade).group(1)
          fn=f'FutureCodeSolarQuote-v{version}.apk'
          apk=pathlib.Path('solarquote/releases')/fn
          shutil.copy2('solarquote/signing/app-signed.apk', apk)
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          update={
            'packageName':'com.futurecode.solarquote',
            'versionCode':code,
            'versionName':version,
            'notes':'Future Code SolarQuote - stable signed release, offline quote calculators and update checks',
            'apkUrl':'https://raw.githubusercontent.com/futurecode064-cyber/AI-Recap-GitHub/main/solarquote/releases/'+fn,
            'sha256':sha,
            'publishedAt':datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          }
          pathlib.Path('solarquote/latest.json').write_text(json.dumps(update,indent=2,ensure_ascii=False)+'\n')
          pathlib.Path('solarquote/release-sha256.txt').write_text(sha+'  '+fn+'\n')
          print('Built signed',fn,'versionCode',code,'hash',sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SolarQuote-signed-release
          path: |
            solarquote/releases/*.apk
            solarquote/latest.json
            solarquote/release-sha256.txt
          if-no-files-found: error
      - name: Publish public APK and update manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solarquote/releases/ solarquote/latest.json solarquote/release-sha256.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish SolarQuote signed APK and verified update manifest [skip ci]"
            git push origin HEAD:main
          fi
